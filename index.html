<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" />
<title>Momentum</title>
<style>
:root {
  --bg:#07111f;
  --bg-top:#10233f;
  --card:#102033;
  --card-strong:#152942;
  --border:#27415f;
  --text:#f8fafc;
  --dim:#9ab0c8;
  --accent:#22c55e;
  --accent-2:#f59e0b;
  --accent-cool:#38bdf8;
  --danger:#f87171;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-xl:24px;
  --pad-card:16px;
  --pad-screen:16px;
  --nav-h:70px;
  --font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
body{
  margin:0;
  background:
    radial-gradient(circle at top, rgba(56,189,248,.18), transparent 32%),
    radial-gradient(circle at bottom right, rgba(34,197,94,.14), transparent 24%),
    linear-gradient(180deg,var(--bg-top),var(--bg));
  color:var(--text);
  font-family:var(--font-family);
  min-height:100vh;
}
.screen{
  padding:var(--pad-screen);
  padding-bottom:calc(var(--nav-h) + 40px);
  max-width:600px;
  margin:0 auto;
  animation:screenIn .28s ease;
}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)), var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-xl);
  box-shadow:0 20px 40px rgba(0,0,0,.18);
  backdrop-filter:blur(10px);
  padding:var(--pad-card);
  margin-bottom:16px;
}
.card h2{
  margin:0 0 8px 0;
  font-size:16px;
  font-weight:600;
  color:var(--text);
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:.4rem;
}
.small{
  font-size:12px;
  color:var(--dim);
  line-height:1.4;
}
.row-between{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:6px;
  font-size:14px;
}
.row-left{
  color:var(--text);
  font-weight:600;
}
.row-right{
  color:var(--text);
  font-weight:600;
  text-align:right;
}
.progress-bg{
  background:#334155;
  border-radius:999px;
  height:10px;
  overflow:hidden;
  margin-top:12px;
}
.progress-fg{
  background:var(--accent);
  height:10px;
  width:0%;
}
.big-score{
  font-size:28px;
  font-weight:700;
  color:var(--accent);
  margin:4px 0;
}
.subtle{
  color:var(--dim);
  font-size:14px;
  font-weight:400;
}
.input-label{
  color:var(--dim);
  font-size:12px;
  margin-bottom:4px;
  display:block;
}
.input, textarea.input, select.input{
  width:100%;
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:10px 12px;
  font-size:16px;
  margin-bottom:12px;
  font-family:inherit;
}
textarea.input{
  min-height:80px;
  resize:none;
}
.btn-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px;
}
.btn{
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:10px 16px;
  font-size:14px;
  color:var(--text);
  font-weight:500;
  min-height:44px;
  touch-action:manipulation;
  transition:transform .16s ease, border-color .16s ease, background .16s ease;
}
.btn:active{transform:scale(.98);}
.btn.danger{
  color:var(--danger);
  border-color:rgba(248,113,113,.6);
}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),#059669);
  border-color:var(--accent);
  color:#ecfeff;
}
.btn.soft{
  background:rgba(56,189,248,.1);
  border-color:rgba(56,189,248,.3);
}
.list-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
  margin-bottom:8px;
  font-size:14px;
  color:var(--text);
  word-break:break-word;
}
.list-row .del{
  color:#f87171;
  font-size:14px;
  cursor:pointer;
  user-select:none;
}
.badge-num{
  font-weight:600;
  color:var(--accent);
}
.challenge-bar-bg{
  background:#334155;
  border-radius:999px;
  height:8px;
  overflow:hidden;
  margin-top:6px;
}
.challenge-bar-fg{
  background:var(--accent);
  height:8px;
  width:0%;
}
.flex-col{
  display:flex;
  flex-direction:column;
}
.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:var(--nav-h);
  background:rgba(7,17,31,.88);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:999;
  font-size:12px;
  backdrop-filter:blur(18px);
}
.nav-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--text);
  text-decoration:none;
  font-weight:500;
  background:none;
  border:0;
  padding:0;
  font-family:inherit;
  min-width:0;
  flex:1;
  font-size:11px;
}
.nav-btn.active{
  color:var(--accent);
}
.nav-emoji{
  font-size:20px;
  line-height:20px;
  margin-bottom:4px;
}
.hidden{display:none;}
.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.mini-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.stat-chip{
  border:1px solid var(--border);
  background:rgba(255,255,255,.04);
  border-radius:14px;
  padding:12px;
}
.stat-chip .small{
  margin-top:4px;
}
.calendar-strip{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:6px;
  margin-top:10px;
}
.calendar-day{
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 6px;
  text-align:center;
  background:rgba(255,255,255,.03);
}
.calendar-day.active{
  border-color:rgba(16,185,129,.7);
  background:rgba(16,185,129,.12);
}
.calendar-day.good{
  background:rgba(16,185,129,.12);
}
.calendar-day.empty{
  opacity:.65;
}
.sticky-actions{
  position:sticky;
  bottom:calc(var(--nav-h) + 12px);
  z-index:10;
}
.hero-card{
  background:
    radial-gradient(circle at top right, rgba(34,197,94,.28), transparent 35%),
    linear-gradient(135deg, rgba(21,41,66,.95), rgba(9,19,33,.96));
}
.hero-head{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:flex-start;
}
.hero-title{
  margin:0;
  font-size:30px;
  line-height:1;
  letter-spacing:.02em;
}
.hero-kicker{
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11px;
  color:#c9f7dd;
  margin-bottom:8px;
}
.hero-sub{
  max-width:32ch;
  margin-top:8px;
}
.score-pill{
  min-width:96px;
  border-radius:18px;
  padding:12px 14px;
  background:rgba(7,17,31,.44);
  border:1px solid rgba(255,255,255,.08);
  text-align:right;
}
.hero-grid{
  display:grid;
  grid-template-columns:1.4fr 1fr;
  gap:12px;
  margin-top:16px;
}
.hero-panel{
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:14px;
  background:rgba(7,17,31,.28);
}
.hero-badges{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05);
  font-size:12px;
  color:var(--text);
}
.tone-ready{color:#bbf7d0;border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.12);}
.tone-steady{color:#fde68a;border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.12);}
.tone-recovery{color:#bae6fd;border-color:rgba(56,189,248,.45);background:rgba(56,189,248,.12);}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.week-plan{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:8px;
  margin-top:12px;
}
.day-pill{
  border:1px solid var(--border);
  border-radius:16px;
  padding:10px 8px;
  background:rgba(255,255,255,.03);
  text-align:center;
}
.day-pill.active{
  border-color:rgba(34,197,94,.55);
  background:rgba(34,197,94,.12);
}
.day-pill .small{display:block;margin-top:4px;}
.segmented{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.record-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:12px;
}
.record-card{
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  background:rgba(255,255,255,.04);
}
.record-value{
  font-size:22px;
  font-weight:700;
  color:var(--accent);
  margin-top:8px;
}
.list-row.soft{
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.05);
  border-radius:14px;
  background:rgba(255,255,255,.03);
}
.fab-row{
  position:sticky;
  bottom:calc(var(--nav-h) + 12px);
  display:flex;
  gap:10px;
  z-index:11;
  margin-top:14px;
}
.fab-row .btn{
  flex:1;
  min-height:50px;
}
#toast {
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(var(--nav-h) + 16px);
  background:var(--accent);
  color:#0f172a;
  font-size:14px;
  font-weight:600;
  padding:10px 16px;
  border-radius:999px;
  opacity:0;
  transition:opacity .25s;
  z-index:1000;
}
#toast.show{opacity:1;}
@keyframes screenIn{
  from{opacity:.55;transform:translateY(6px);}
  to{opacity:1;transform:none;}
}
@media (max-width: 480px){
  .quick-grid,
  .mini-grid,
  .hero-grid,
  .record-grid,
  .segmented{
    grid-template-columns:1fr;
  }
  .week-plan{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .screen{
    padding:14px;
    padding-bottom:calc(var(--nav-h) + 56px);
  }
  .hero-head{
    flex-direction:column;
  }
  .score-pill{
    width:100%;
    text-align:left;
  }
}
</style>
</head>
<body>

<div id="toast">Saved</div>

<div id="screen-overview" class="screen">
  <div class="card">
    <h2>Momentum</h2>
    <div class="small">Loading your dashboard...</div>
  </div>
</div>
<div id="screen-plan" class="screen hidden"></div>
<div id="screen-health" class="screen hidden"></div>
<div id="screen-lifestyle" class="screen hidden"></div>
<div id="screen-workout" class="screen hidden"></div>
<div id="screen-75hard" class="screen hidden"></div>
<div id="screen-reset" class="screen hidden"></div>
<div id="screen-history" class="screen hidden"></div>

<nav class="nav">
  <button class="nav-btn active" data-target="overview"><div class="nav-emoji">T</div>Today</button>
  <button class="nav-btn" data-target="plan"><div class="nav-emoji">P</div>Plan</button>
  <button class="nav-btn" data-target="health"><div class="nav-emoji">H</div>Health</button>
  <button class="nav-btn" data-target="history"><div class="nav-emoji">R</div>History</button>
</nav>

<script>
// helpers
function lsGet(key, fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback;}catch(e){return fallback;}}
function lsSet(key, val){localStorage.setItem(key, JSON.stringify(val));}
function todayISO(){
  const d=new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}

function weekStartISO(dateISO){
  const d = new Date((dateISO||todayISO())+"T00:00:00");
  const g = d.getDay();
  const diff = (g===0?-6:1)-g;
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  return d.toISOString().slice(0,10);
}
function addDaysISO(dateISO, n){
  const d = new Date(dateISO+"T00:00:00");
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function monthKey(dateISO){
  return (dateISO||todayISO()).slice(0,7); // YYYY-MM
}


function mondayOfThisWeekISO(){const d=new Date();const g=d.getDay();const diff=(g===0?-6:1)-g;d.setDate(d.getDate()+diff);d.setHours(0,0,0,0);return d.toISOString().slice(0,10);}
function uid(){return Math.random().toString(36).slice(2,10);}
function showToast(msg="Saved"){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);}

function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, s=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[s]));
}
function escapeAttr(str){ return escapeHtml(str); }

function minutesToPoints(min){
  const m = Number(min);
  if(!isFinite(m) || m < 15) return 0;
  return Math.floor(m/15);
}



function kmToMiles(km){ return (Number(km)||0) * 0.621371; }
function milesToKm(mi){ return (Number(mi)||0) * 1.60934; }
function fmtMiFromKm(km){
  const m = kmToMiles(km);
  return Math.round(m*10)/10;
}

function currentWeight(){
  if(!hLog.length) return null;
  return parseFloat(hLog[0].weight)||null;
}

function weightProgress(){
  if(weightStart==null || weightGoal==null) return null;
  const cw=currentWeight();
  if(cw==null) return null;
  const total = weightStart - weightGoal;
  if(total<=0) return null;
  const done = weightStart - cw;
  return Math.max(0, Math.min(100, Math.round((done/total)*100)));
}
function weightToGoal(){
  const cw=currentWeight();
  if(cw==null || weightGoal==null) return null;
  return Math.round((cw - weightGoal)*10)/10;
}

function weightLost(){
  if(weightStart==null) return null;
  const cw=currentWeight();
  if(cw==null) return null;
  return Math.round((weightStart - cw)*10)/10;
}


function compliment(){
  const msgs=["That counts.", "Quiet progress is still progress.", "You\u2019re building momentum.", "Small actions. Big direction.", "Proof > perfect.", "You showed up \u2014 that\u2019s the win.", "You\u2019re doing the work.", "This is how it changes."];
  return msgs[Math.floor(Math.random()*msgs.length)];
}
function maybeUnlock(key,label){
  if(unlocked[key]) return;
  unlocked[key]=true;
  recomputeSessionCounters();
    persist();
  showToast("Unlocked: "+label);
}



function toCSV(rows){
  if(!rows || !rows.length) return "";
  const esc = (v)=>{
    const s = (v===null || v===undefined) ? "" : String(v);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  };
  return rows.map(r=>r.map(esc).join(",")).join("\n");
}
function downloadCSV(filename, rows){
  const csvText = toCSV(rows);
  const blob = new Blob([csvText], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 500);
}

function defaultHabitDefs(){
  return [
    {key:"sleep7", label:"Sleep >=7h", icon:"Sleep"},
    {key:"steps", label:"Steps >= 15,000", icon:"Steps"},
    {key:"outside", label:"Outside time >= 30 min", icon:"Outside"},
    {key:"no_sugar", label:"No added sugar", icon:"Nutrition"},
    {key:"reading", label:"Reading", icon:"Mind"},
    {key:"mindbody", label:"Meditation or Stretch/Yoga", icon:"Recovery"},
    {key:"declutter30", label:"Declutter/Clean 30 min", icon:"Reset"}
  ];
}

function normalizeHabitDefs(list){
  const base = Array.isArray(list) && list.length ? list : defaultHabitDefs();
  return base.map((h, idx)=>({
    key: String(h.key || ("habit_" + idx)).replace(/[^a-z0-9_]+/gi,"_").toLowerCase(),
    label: String(h.label || ("Habit " + (idx + 1))).trim(),
    icon: String(h.icon || "Habit").trim()
  })).filter(h=>h.label);
}

function defaultReminderSettings(){
  return {enabled:false, time:"19:00", permission:"default", lastNotified:"", fallbackShown:""};
}

function defaultWorkoutTemplates(){
  return [];
}

function defaultCustomChallenges(){
  return [];
}

function default75HardState(){
  return {startDate:"", notes:"", days:{}, tasks:defaultMentalToughnessTasks()};
}

function defaultMentalToughnessTasks(){
  return [
    {key:"workout1", label:"Movement session 1"},
    {key:"workout2", label:"Movement session 2"},
    {key:"outdoor", label:"Get outside for one session"},
    {key:"water", label:"Hydration goal"},
    {key:"diet", label:"Nutrition goal"},
    {key:"reading", label:"Read 10 pages"},
    {key:"photo", label:"Quick progress photo"},
    {key:"clean", label:"Stay on plan"}
  ];
}

function normalizeMentalToughnessTasks(list){
  const base = Array.isArray(list) && list.length ? list : defaultMentalToughnessTasks();
  return base.map((task, idx)=>({
    key: String(task.key || ("mt_goal_" + idx)).replace(/[^a-z0-9_]+/gi,"_").toLowerCase(),
    label: String(task.label || ("Goal " + (idx + 1))).trim()
  })).filter(task=>task.label);
}

function hard75TaskDefs(){
  return normalizeMentalToughnessTasks(hard75?.tasks);
}

function defaultResetWeekTemplate(){
  return {
    Mon:{movement:"5k training", care:"Tidy one small area", meaning:"Gratitude"},
    Tue:{movement:"Walk", care:"Skincare", meaning:"Journal"},
    Wed:{movement:"Yoga", care:"Nourishing meal", meaning:"One thing to look forward to"},
    Thu:{movement:"Walk or run", care:"Early night", meaning:"Gratitude"},
    Fri:{movement:"5k training", care:"Haircut or home care task", meaning:"Journal"},
    Sat:{movement:"Longer walk or run", care:"Enjoyable outing or coffee", meaning:"Reflect"},
    Sun:{movement:"Spa Sunday or stretch", care:"Reset your space", meaning:"Plan the week"}
  };
}

function defaultResetState(){
  return {days:{}, weekTemplate:defaultResetWeekTemplate()};
}

function normalizeResetWeekTemplate(template){
  const base = Object.assign({}, defaultResetWeekTemplate(), template || {});
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(day=>{
    base[day] = Object.assign({movement:"", care:"", meaning:""}, base[day] || {});
  });
  return base;
}

function getResetEntry(day){
  return Object.assign({body:false, care:false, meaning:false, note:""}, resetCompass?.days?.[day] || {});
}

function getResetStats(){
  const today = todayISO();
  const entry = getResetEntry(today);
  const doneToday = ["body","care","meaning"].reduce((sum,key)=>sum + (entry[key] ? 1 : 0), 0);
  let streak = 0;
  for(let i=0;i<60;i++){
    const day = addDaysISO(today, -i);
    const row = getResetEntry(day);
    if(row.body || row.care || row.meaning) streak += 1;
    else break;
  }
  let fullDays = 0;
  for(let i=0;i<28;i++){
    const day = addDaysISO(today, -i);
    const row = getResetEntry(day);
    if(row.body && row.care && row.meaning) fullDays += 1;
  }
  return {doneToday, streak, fullDays};
}

function get75HardEntry(day){
  return Object.assign({notes:""}, hard75?.days?.[day] || {});
}

function is75HardComplete(day){
  const row = get75HardEntry(day);
  return hard75TaskDefs().every(task=>!!row[task.key]);
}

function get75HardStats(){
  const today = todayISO();
  const tasks = hard75TaskDefs();
  const started = !!hard75.startDate;
  const start = started ? hard75.startDate : today;
  const daysInto = started ? Math.max(1, Math.floor((new Date(today+"T00:00:00") - new Date(start+"T00:00:00")) / 86400000) + 1) : 1;
  const currentEntry = get75HardEntry(today);
  const doneToday = tasks.reduce((sum, task)=>sum + (currentEntry[task.key] ? 1 : 0), 0);
  let completedDays = 0;
  let streak = 0;
  for(let i=0;i<75;i++){
    const day = addDaysISO(start, i);
    if(day > today) break;
    if(is75HardComplete(day)){
      completedDays += 1;
      if(day === addDaysISO(today, -streak)) streak += 1;
    }else if(day === addDaysISO(today, -streak)){
      break;
    }
  }
  return {
    started,
    start,
    daysInto,
    doneToday,
    totalTasks: tasks.length,
    completedDays,
    streak,
    percent: Math.max(0, Math.min(100, Math.round((completedDays / 75) * 100)))
  };
}

function defaultWeeklyPlan(){
  return {
    Mon:"Strength",
    Tue:"Cardio",
    Wed:"Recovery",
    Thu:"Strength",
    Fri:"Cardio",
    Sat:"Long Session",
    Sun:"Reset"
  };
}

function dayKeyFromISO(dateISO){
  const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return names[new Date((dateISO||todayISO())+"T00:00:00").getDay()];
}

function weeklyPlanLabel(dateISO){
  return weeklyPlan[dayKeyFromISO(dateISO)] || "Open";
}

function planTone(label){
  if(/strength|push|hard|long/i.test(label||"")) return "tone-ready";
  if(/cardio|steady|open/i.test(label||"")) return "tone-steady";
  return "tone-recovery";
}

function openPlan(mode){
  window._planMode = mode || "overview";
  showScreen("plan");
}

function getLaggingHabit(){
  const today = todayISO();
  let best = null;
  habitDefs.forEach(h=>{
    let lastDone = "";
    for(let i=0;i<45;i++){
      const day = addDaysISO(today, -i);
      if(lwDays?.[day]?.[h.key]){
        lastDone = day;
        break;
      }
    }
    const gap = lastDone ? Math.max(0, Math.round((new Date(today+"T00:00:00") - new Date(lastDone+"T00:00:00")) / 86400000)) : 99;
    if(!best || gap > best.gap) best = {key:h.key, label:h.label, gap, lastDone};
  });
  return best;
}

function computeRecords(){
  const longestWorkout = entries.reduce((best,e)=>{
    const dur = Number(e.duration)||0;
    if(dur > best.value) return {value:dur, label:(e.category||"Workout"), date:e.date||""};
    return best;
  }, {value:0,label:"",date:""});
  const mostSteps = entries.reduce((best,e)=>{
    const steps = Number(e.steps)||0;
    if(steps > best.value) return {value:steps, label:(e.category||"Steps"), date:e.date||""};
    return best;
  }, {value:0,label:"",date:""});
  const byWeek = {};
  const byMonth = {};
  entries.forEach(e=>{
    const day = (e.date||"").slice(0,10);
    if(!day) return;
    const points = minutesToPoints(Number(e.duration)||0);
    const wk = weekStartISO(day);
    const mk = day.slice(0,7);
    byWeek[wk] = (byWeek[wk]||0) + points;
    byMonth[mk] = (byMonth[mk]||0) + points;
  });
  let bestWeek = {value:0,label:""};
  Object.entries(byWeek).forEach(([label, value])=>{ if(value > bestWeek.value) bestWeek = {value, label}; });
  let bestMonth = {value:0,label:""};
  Object.entries(byMonth).forEach(([label, value])=>{ if(value > bestMonth.value) bestMonth = {value, label}; });
  return {longestWorkout, mostSteps, bestWeek, bestMonth};
}

        const hasWorkout = entries.some(e=>(e.date||"").slice(0,10)===day);
        const hasHabit = habitDefs.some(h=>!!lwDays?.[day]?.[h.key]);
        if(hasWorkout || hasHabit) total += 1;
      }
      return total;

function getChallengeProgress(challenge){
  if(!challenge) return {value:0,target:0,pct:0,label:""};
  const metric = CHALLENGE_METRICS[challenge.metric];
  if(!metric) return {value:0,target:Number(challenge.target)||0,pct:0,label:""};
  const value = Number(metric.getValue() || 0);
  const target = Number(challenge.target) || 0;
  const pct = Math.min(100, Math.round((value / (target || 1)) * 100));
  return {value, target, pct, label:metric.label};
}

function getBadgeTier(metric, challengeName){
  const prior = achievements.filter(a=>
    a.type === "challenge_badge" &&
    a.metric === metric &&
    String(a.name || "").toLowerCase() === String(challengeName || "").toLowerCase()
  ).length;
  const nth = prior + 1;
  if(nth >= 5) return {tier:"Gold", nth};
  if(nth >= 3) return {tier:"Silver", nth};
  return {tier:"Bronze", nth};
}

function maybeCompleteCustomChallenge(){
  if(!activeChallengeId) return false;
  const idx = customChallenges.findIndex(c=>c.id===activeChallengeId);
  if(idx < 0) return false;
  const challenge = customChallenges[idx];
  if(challenge.completedAt) return false;
  const progress = getChallengeProgress(challenge);
  if(progress.value < progress.target || !progress.target) return false;

  const completedAt = new Date().toISOString();
  const badgeTier = getBadgeTier(challenge.metric, challenge.name);
  const rewardName = `${badgeTier.tier} ${challenge.name} badge`;
  customChallenges[idx] = Object.assign({}, challenge, {completedAt, rewardName, badgeTier:badgeTier.tier, completionCount:badgeTier.nth});
  achievements = [{
    id:uid(),
    type:"challenge_badge",
    name:challenge.name,
    rewardName,
    badgeTier:badgeTier.tier,
    completionCount:badgeTier.nth,
    completedAt,
    metric:challenge.metric,
    target:challenge.target
  }, ...achievements].slice(0, 50);
  maybeUnlock(`challenge_${challenge.id}`, rewardName);
  persist();
  showToast(`Challenge complete: ${challenge.name}`);
  return true;
}

function todayActivityCount(){
  const t = todayISO();
  const habitCount = Object.values(lwDays?.[t] || {}).filter(Boolean).length;
  const workoutCount = entries.filter(e=>(e.date||"").slice(0,10)===t).length;
  const checkinCount = checkins.filter(e=>(e.date||"").slice(0,10)===t).length;
  const healthCount = bpLog.filter(e=>(e.date||"").slice(0,10)===t).length + hLog.filter(e=>(e.date||"").slice(0,10)===t).length;
  return habitCount + workoutCount + checkinCount + healthCount;
}

function getTodayReadiness(){
  return readinessLog[todayISO()] || {energy:3,soreness:3,sleep:"",note:""};
}

function readinessScoreFor(day){
  const row = readinessLog?.[day];
  if(!row) return null;
  const energy = Number(row.energy)||0;
  const soreness = Number(row.soreness)||0;
  const sleep = Number(row.sleep)||0;
  if(!energy && !soreness && !sleep) return null;
  const score = Math.round(((energy*20) + ((6-Math.min(5,Math.max(1,soreness||3)))*15) + Math.min(10, sleep)*4));
  return Math.max(0, Math.min(100, score));
}

function buildTodayPlan(){
  const score = readinessScoreFor(todayISO());
  const habitGap = Math.max(0, habitDefs.length - habitDefs.reduce((s,h)=>s+(lwDays?.[todayISO()]?.[h.key]?1:0),0));
  if(score == null){
    return {
      label:"Set your recovery first",
      tone:"soft",
      text:"Log energy, soreness, and sleep to get a tailored plan.",
      actions:["Save recovery","Do 1 easy win"]
    };
  }
  if(score >= 78){
    return {
      label:"Push day",
      tone:"primary",
      text:"You look ready for a stronger session. Go for strength, intervals, or a longer cardio block.",
      actions:["Lift 45 min","Try a challenge set"]
    };
  }
  if(score >= 58){
    return {
      label:"Steady day",
      tone:"soft",
      text:`Aim for consistency: one workout plus ${habitGap > 0 ? Math.min(2, habitGap) : 1} small reset actions.`,
      actions:["Walk or ride","Add a reset win"]
    };
  }
  return {
    label:"Recovery day",
    tone:"soft",
    text:"Keep the streak alive with mobility, walking, hydration, and sleep.",
    actions:["Yoga 20","Take an easy walk"]
  };
}

async function maybeSendReminder(){
  if(!reminderSettings.enabled) return;
  const now = new Date();
  const today = todayISO();
  const time = String(reminderSettings.time || "19:00");
  const parts = time.split(":");
  const hours = Number(parts[0] || 0);
  const minutes = Number(parts[1] || 0);
  const due = new Date();
  due.setHours(hours, minutes, 0, 0);
  if(now < due) return;
  if(todayActivityCount() > 0) return;
  if(reminderSettings.lastNotified === today || reminderSettings.fallbackShown === today) return;

  if("Notification" in window && Notification.permission === "granted"){
    try{
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg){
        await reg.showNotification("Momentum check-in", {
          body:"Log one reset win or one workout today to keep your streak moving.",
          icon:"./icons/icon-192.png",
          badge:"./icons/icon-192.png",
          tag:"momentum-daily-reminder"
        });
        reminderSettings.lastNotified = today;
        reminderSettings.permission = Notification.permission;
        persist();
        return;
      }
    }catch(e){}
  }

  reminderSettings.fallbackShown = today;
  persist();
  showToast("Reminder: log one reset win or one workout today");
}

const serializedStorageCache = Object.create(null);
let persistTimer = null;

function flushPersist(){
  if(persistTimer){
    clearTimeout(persistTimer);
    persistTimer = null;
  }
  Object.keys(STORAGE_GETTERS).forEach((key)=>{
    const nextValue = JSON.stringify(STORAGE_GETTERS[key]());
    if(serializedStorageCache[key] !== nextValue){
      localStorage.setItem(key, nextValue);
      serializedStorageCache[key] = nextValue;
    }
  });
}

function calcStrengthDensity(entry){
  const reps = (parseFloat(entry.reps)||0) + (parseFloat(entry.pushups)||0) + (parseFloat(entry.swings)||0);
  const mins = parseFloat(entry.duration)||0;
  if(!reps || !mins) return null;
  return Math.round((reps / mins)*10)/10;
}


function uniqueDaysCount(filterFn){
  const s=new Set();
  (entries||[]).forEach(e=>{
    const d=(e.date||"").slice(0,10);
    if(!d) return;
    if(filterFn(e)) s.add(d);
  });
  return s.size;
}

// Recompute session-type counters so "sessions" mean "days" (1 per day)
function recomputeSessionCounters(){
  const isYoga = (e)=> (String(e.category||"").toLowerCase().match(/yoga|stretch/) );
  const isStrength = (e)=> (String(e.category||"").toLowerCase().match(/strength|kettlebell|kb|push|circuit/) );
  const isCardio = (e)=> (String(e.category||"").toLowerCase().match(/cardio|row|cycle|running|bike|stair|stairs|climb/) );

  // weekly
  if(typeof weeklyProg==="object" && weeklyProg){
    weeklyProg.strengthSessions = uniqueDaysCount(isStrength);
    weeklyProg.cardioSessions   = uniqueDaysCount(isCardio);
    weeklyProg.yogaSessions     = uniqueDaysCount(isYoga);
  }

  // monthly
  if(typeof monthlyProg==="object" && monthlyProg){
    // Keep yogaSessions as days too
    monthlyProg.yogaSessions = uniqueDaysCount(isYoga);
  }

  // weekend warrior: count days within current weekend bucket if youâ€™re using it as per-day too.
  // If weekendProg has yogaSessions, make it per-day within weekend by filtering dates in weekend range.
  if(typeof weekendProg==="object" && weekendProg){
    // Weekend definition: Sat+Sun of current week epoch (weekEpoch)
    const we = new Date(weekEpoch || mondayOfThisWeekISO());
    const sat = new Date(we); sat.setDate(sat.getDate()+5);
    const sun = new Date(we); sun.setDate(sun.getDate()+6);
    const satKey = sat.toISOString().slice(0,10);
    const sunKey = sun.toISOString().slice(0,10);
    const inWeekend = (e)=>{
      const d=(e.date||"").slice(0,10);
      return d===satKey || d===sunKey;
    };
    const weekendYogaDays = new Set();
    (entries||[]).forEach(e=>{
      const d=(e.date||"").slice(0,10);
      if(!d || !inWeekend(e)) return;
      if(isYoga(e)) weekendYogaDays.add(d);
    });
    weekendProg.yogaSessions = weekendYogaDays.size;
  }
}

function rebuildDerivedProgress(){
  const thisMonth = monthKey(todayISO());
  monthlyProg = {swings:0,cyclingKm:0,distanceKm:0,walkKm:0,yogaSessions:0,mobilitySessions:0,pushups:0,floors:0};
  weeklyProg = {strengthSessions:0,cardioSessions:0,distanceKm:0,rowingKm:0,reps:0,plankSec:0,mobilitySessions:0,floors:0,steps:0};
  weekendProg = {swings:0,distanceKm:0,footKm:0,yogaSessions:0,reps:0,circuitEx:0,strengthSessions:0};

  (entries||[]).forEach(rec=>{
    const dateKey = (rec.date||"").slice(0,10);
    if(!dateKey) return;
    const cat = String(rec.category||"").toLowerCase();
    const kmVal = (parseFloat(rec.km)||0) + (parseFloat(rec.miles)||0)*1.60934;
    const swingsVal = parseFloat(rec.swings)||0;
    const pushupsVal = parseFloat(rec.pushups)||0;
    const floorsVal = parseFloat(rec.floors)||0;
    const plankVal = parseFloat(rec.plank)||0;
    const stepsVal = parseFloat(rec.steps)||0;
    const circuitExVal = parseFloat(rec.circuitEx)||0;
    const isYoga = /yoga|stretch/.test(cat);
    const isCurrentWeek = dateKey >= weekEpoch && dateKey < addDaysISO(weekEpoch, 7);
    const wd = new Date(dateKey+"T00:00:00").getDay();
    const isWeekend = wd===6 || wd===0;

    if(dateKey.slice(0,7)===thisMonth){
      monthlyProg.swings += swingsVal;
      monthlyProg.cyclingKm += /cycle|bike|cycling/.test(cat) ? kmVal : 0;
      monthlyProg.walkKm += /walk/.test(cat) ? kmVal : 0;
      monthlyProg.pushups += pushupsVal;
      if(isYoga) monthlyProg.mobilitySessions += 1;
    }

    if(isCurrentWeek){
      weeklyProg.floors += floorsVal;
      weeklyProg.distanceKm += /running|row|cycle|bike|cycling/.test(cat) ? kmVal : 0;
      weeklyProg.rowingKm += /row/.test(cat) ? kmVal : 0;
      weeklyProg.steps += stepsVal;
      weeklyProg.plankSec += plankVal;
      if(isYoga) weeklyProg.mobilitySessions += 1;
    }

    if(isWeekend){
      weekendProg.swings += swingsVal;
      weekendProg.distanceKm += kmVal;
      weekendProg.circuitEx += circuitExVal;
      if(/walk|running|hike/.test(cat)) weekendProg.footKm += kmVal;
    }
  });

  recomputeSessionCounters();
}




function computeWorkoutPoints(weekStart){
  return entries.filter(e=>e.date>=weekStart).reduce((sum,e)=>{
    const mins=Number(e.duration)||0;
    const pts=minutesToPoints(mins);
    return sum+pts;
  },0);
}
function registerActivity(){ /* no-op: used by habit tracking */ }

function computeLifestylePoints(weekStart){
  // Lifestyle scoring (simple + consistent):
  // Per habit per week:
  //   0â€“4 days = 0 pts
  //   5â€“6 days = 5 pts
  //   7 days   = 10 pts
  const HABIT_KEYS = ["sleep7","steps","outside","no_sugar","reading","mindbody","declutter30"];
  const s=new Date(weekStart+"T00:00:00");
  const days=[];
  for(let i=0;i<7;i++){ const d=new Date(s); d.setDate(d.getDate()+i); days.push(d.toISOString().slice(0,10)); }

  let total=0;
  HABIT_KEYS.forEach(k=>{
    let c=0;
    days.forEach(dk=>{ if(lwDays?.[dk]?.[k]) c++; });
    if(c>=7) total+=10;
    else if(c>=5) total+=5;
  });
  return total;
}
function computeHealthPoints(weekStart){
  return bpLog.filter(r=>r.date>=weekStart).length;
}
function computeMotivationPoints(weekStart){
  return motLog.filter(m=>m.date>=weekStart).reduce((sum,m)=>sum+m.points,0);
}
function computeBonus(weekStart){
  let bonus=0;
  // habit streaks
  const habitKeys=new Set();
  Object.values(lwDays).forEach(row=>{
    Object.keys(row||{}).forEach(k=>habitKeys.add(k));
  });
  habitKeys.forEach(k=>{
    let c=0;
    const s=new Date(weekStart);
    for(let i=0;i<7;i++){
      const d=new Date(s); d.setDate(d.getDate()+i);
      const dk=d.toISOString().slice(0,10);
      if(lwDays?.[dk]?.[k]) c++;
    }
    if(c>=7) bonus+=5;
  });
  // 3+ workouts
  const workoutsThisWeek = entries.filter(e=>e.date>=weekStart).length;
  if(workoutsThisWeek>=3) bonus+=10;
  // BP victory
  const last3=bpLog.slice(0,3);
  if(last3.length===3){
    const avgS=Math.round(last3.reduce((s,x)=>s+(parseFloat(x.sys)||0),0)/3);
    const avgD=Math.round(last3.reduce((s,x)=>s+(parseFloat(x.dia)||0),0)/3);
    if(avgS<120 && avgD<80) bonus+=15;
  }
  return bonus;
}
function calcWeekComponents(weekStart){
  const workoutPts=computeWorkoutPoints(weekStart);
  const lifestylePts=computeLifestylePoints(weekStart);
  const healthPts=computeHealthPoints(weekStart);
  const motivationPts=computeMotivationPoints(weekStart);
  const bonusPts=computeBonus(weekStart);
  const total=workoutPts+lifestylePts+healthPts+motivationPts+bonusPts;
  return {workoutPts,lifestylePts,healthPts,motivationPts,bonusPts,total};
}
function calcWeekTotalPoints(weekStart){
  return calcWeekComponents(weekStart).total;
}

// persist
function persist(immediate=false){
  if(immediate){
    flushPersist();
    return;
  }
  if(persistTimer) clearTimeout(persistTimer);
  persistTimer = setTimeout(flushPersist, 120);
}

// Backup / Restore helpers (useful when the app is opened from a different file name/path)
const MOMENTUM_DATA_KEYS = [
  "workout_entries","bp_log","h_log","weight_start","weight_goal",
  "lw_days","lw_epoch","focus_week","reflections","mot_log",
  "gratitude_log","journal_log","weekly_mantra","daily_checkins","achievements",
  "habit_defs","readiness_log","workout_templates","custom_challenges","active_challenge_id","hard_75","reset_compass","weekly_plan","reminder_settings","last_backup_export",
  "week_epoch_snapshot","last_week_snapshot","weekly_goal","adaptive_goals",
  "fired_flags","todays_wins","month_theme","low_energy","unlocked",
  "longTermProg","monthlyProg","weeklyProg","weekendProg",
  "last_cat"
];

function exportMomentumData(){
  const data = {};
  MOMENTUM_DATA_KEYS.forEach(k=>{
    const v = localStorage.getItem(k);
    if(v !== null) data[k] = v; // store raw strings so import is lossless
  });
  return JSON.stringify({version:1, exported_at: new Date().toISOString(), data}, null, 2);
}

function importMomentumDataFromText(txt){
  try{
    const obj = JSON.parse(txt);
    const payload = obj && obj.data ? obj.data : obj;
    if(!payload || typeof payload !== "object") return false;
    Object.keys(payload).forEach(k=>{
      if(payload[k] === null || payload[k] === undefined) return;
      localStorage.setItem(k, String(payload[k]));
    });
    return true;
  }catch(e){
    return false;
  }
}

function downloadTextFile(filename, content, mime){
  const blob = new Blob([content], {type: (mime||"text/plain;charset=utf-8;")});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 500);
}

// LIFESTYLE (date picker + per-day checkboxes stored by date)
function renderLifestyle(){
  const wrap=document.getElementById("screen-lifestyle");
  const HABITS = normalizeHabitDefs(habitDefs);
  habitDefs = HABITS;

  function iso(d){ return d.toISOString().slice(0,10); }
  function parseISO(s){ const d=new Date((s||todayISO())+"T00:00:00"); d.setHours(0,0,0,0); return d; }
  function weekStartFromISO(s){
    const d=parseISO(s);
    const g=d.getDay();
    const diff=(g===0?-6:1)-g;
    d.setDate(d.getDate()+diff);
    return iso(d);
  }
  function addDays(isoStr, n){
    const d=parseISO(isoStr); d.setDate(d.getDate()+n); return iso(d);
  }

  let selectedDate = window._lifeSelected || todayISO();
  window._lifeSelected = selectedDate;
  lwEpoch = weekStartFromISO(selectedDate);
  const weekStart = lwEpoch;
  const days=[0,1,2,3,4,5,6].map(i=>addDays(weekStart,i));
  const dayLabels=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

  function getCell(dateISO, habitKey){
    return !!(lwDays?.[dateISO]?.[habitKey]);
  }
  function setCell(dateISO, habitKey, val){
    lwDays[dateISO]=lwDays[dateISO]||{};
    lwDays[dateISO][habitKey]=val;
  }
  function countHabitWeek(habitKey){
    return days.reduce((s,d)=>s+(getCell(d,habitKey)?1:0),0);
  }
  function habitWeekPoints(habitKey){
    const c=countHabitWeek(habitKey);
    if(c>=7) return 10;
    if(c>=5) return 5;
    return 0;
  }

  const weekPoints = HABITS.reduce((s,h)=>s+habitWeekPoints(h.key),0);
  const maxWeekPoints = HABITS.length * 10;
  const pct = Math.min(100, Math.round((weekPoints/(maxWeekPoints||1))*100));
  const todayKey = todayISO();
  const todayChecks = HABITS.reduce((s,h)=>s+(lwDays?.[todayKey]?.[h.key]?1:0),0);
  const selectedChecks = HABITS.reduce((s,h)=>s+(lwDays?.[selectedDate]?.[h.key]?1:0),0);

  function anyHabitStreak(){
    const end = parseISO(todayISO());
    let cur = new Date(end);
    let streak=0;
    for(let i=0;i<365;i++){
      const dk=iso(cur);
      const row=lwDays?.[dk]||{};
      const any = HABITS.some(h=>!!row[h.key]);
      if(any) streak++;
      else break;
      cur.setDate(cur.getDate()-1);
    }
    return streak;
  }
  const overallStreak = anyHabitStreak();

  wrap.innerHTML=`
    <div class="card">
      <h2>Lifestyle</h2>
      <div class="small">Today-first habit tracking with editable habits.</div>
      <div class="quick-grid" style="margin-top:12px;">
        <div class="stat-chip">
          <div class="row-between"><div>Today</div><div class="badge-num">${todayChecks}/${HABITS.length}</div></div>
          <div class="small">Habits checked</div>
        </div>
        <div class="stat-chip">
          <div class="row-between"><div>Streak</div><div class="badge-num">${overallStreak}</div></div>
          <div class="small">Days with any habit</div>
        </div>
        <div class="stat-chip">
          <div class="row-between"><div>Week points</div><div class="badge-num">${weekPoints}/${maxWeekPoints}</div></div>
          <div class="small">5/7 = 5 pts, 7/7 = 10 pts</div>
        </div>
      </div>
      <div style="margin-top:14px;">
        <label class="input-label">Date</label>
        <input class="input" id="lifeDate" type="date" value="${selectedDate}"/>
        <div class="small" style="margin-top:-6px;">Selected: <span class="badge-num">${selectedChecks}</span> / ${HABITS.length}</div>
      </div>
      <div class="progress-bg"><div class="progress-fg" style="width:${pct}%;"></div></div>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn danger" id="resetWeekBtn">Reset this week</button>
      </div>
    </div>

    <div class="card">
      <h2>Habits</h2>
      ${HABITS.map(h=>{
        const done=countHabitWeek(h.key);
        const isOn=getCell(selectedDate,h.key);
        const p=Math.min(100, Math.round((done/7)*100));
        const pts=habitWeekPoints(h.key);
        return `
          <div style="margin-bottom:14px;">
            <div class="row-between" style="align-items:center;">
              <div style="flex:1; font-size:14px;">${escapeHtml(h.label)}</div>
              <div class="small" style="margin-right:8px;">${done}/7${pts?` - <span class="badge-num">${pts} pts</span>`:""}</div>
              <label style="display:inline-flex;align-items:center;gap:8px;">
                <input type="checkbox" data-habit="${h.key}" ${isOn?"checked":""} style="transform:scale(1.2);"/>
              </label>
            </div>
            <div class="challenge-bar-bg"><div class="challenge-bar-fg" style="width:${p}%;"></div></div>
          </div>
        `;
      }).join("")}
    </div>

    <div class="card">
      <h2>Habits</h2>
      <div class="small">Make this app fit your real routines.</div>
      ${HABITS.map(h=>`
        <div class="list-row">
          <div style="flex:1;">${escapeHtml(h.label)}</div>
          <button class="btn danger" data-del-habit="${h.key}">Delete</button>
        </div>
      `).join("")}
      <input class="input" id="newHabitLabel" placeholder="Add a new habit"/>
      <div class="btn-row">
        <button class="btn" id="addHabitBtn">Add habit</button>
      </div>
    </div>

    <div class="card">
      <h2>This Week</h2>
      <div class="small">Checks per day for the week of ${weekStart}</div>
      ${days.map((d,i)=>{
        const row=lwDays?.[d]||{};
        const c=HABITS.reduce((s,h)=>s+(row[h.key]?1:0),0);
        const isSel = d===selectedDate;
        return `<div class="list-row" style="${isSel ? "background:rgba(16,185,129,.08);padding:8px 10px;border-radius:12px;" : ""}">
          <div style="flex:1;">${dayLabels[i]} - ${d}</div>
          <div class="badge-num">${c}</div>
        </div>`;
      }).join("")}
    </div>
  `;

  const dp = wrap.querySelector("#lifeDate");
  if(dp){
    dp.onchange=(ev)=>{
      const v=(ev.target.value || todayISO());
      window._lifeSelected = v;
      renderLifestyle();
    };
  }

  wrap.querySelectorAll('input[type="checkbox"][data-habit]').forEach(cb=>{
    cb.onchange=()=>{
      const key=cb.getAttribute("data-habit");
      const dateKey = wrap.querySelector("#lifeDate")?.value || todayISO();
      setCell(dateKey,key,cb.checked);
      window._lifeSelected = dateKey;
      maybeCompleteCustomChallenge();
      persist();
      showToast("Saved");
      renderLifestyle();
    };
  });

  const resetBtn = wrap.querySelector("#resetWeekBtn");
  if(resetBtn){
    resetBtn.onclick=()=>{
      days.forEach(d=>{ delete lwDays[d]; });
      persist();
      showToast("Week reset");
      renderLifestyle();
    };
  }

  wrap.querySelector("#addHabitBtn").onclick=()=>{
    const label = (wrap.querySelector("#newHabitLabel").value||"").trim();
    if(!label) return;
    const keyBase = label.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"") || ("habit_" + uid());
    let key = keyBase;
    let i = 2;
    while(habitDefs.some(h=>h.key===key)){
      key = `${keyBase}_${i++}`;
    }
    habitDefs = [...habitDefs, {key, label, icon:"Habit"}];
    persist();
    showToast("Habit added");
    renderLifestyle();
  };

  wrap.querySelectorAll("[data-del-habit]").forEach(btn=>{
    btn.onclick=()=>{
      const key = btn.getAttribute("data-del-habit");
      habitDefs = habitDefs.filter(h=>h.key!==key);
      Object.keys(lwDays||{}).forEach(day=>{
        if(lwDays[day] && key in lwDays[day]) delete lwDays[day][key];
      });
      persist();
      showToast("Habit removed");
      renderLifestyle();
    };
  });
}

  const importBtn = wrap.querySelector("#importDataBtn");

      lastBackupExport = {date: todayISO(), text: txt};

      showToast("Downloaded");
    };
  }
  if(copyBtn && backupText){
    copyBtn.onclick=async ()=>{
      const txt = backupText.value || "";
      if(!txt.trim()){ showToast("Nothing to copy"); return; }
      try{
        await navigator.clipboard.writeText(txt);
        showToast("Copied");
      }catch(e){
        backupText.focus(); backupText.select();
        document.execCommand("copy");
        showToast("Copied");
      }
    };
  }
  if(importBtn && backupText){
    importBtn.onclick=()=>{
      const txt = (backupText.value||"").trim();
      if(!txt){ showToast("Paste backup JSON first"); return; }
      const ok = importMomentumDataFromText(txt);
      if(!ok){ showToast("Invalid JSON"); return; }
      showToast("Imported - reloading...");
      setTimeout(()=>location.reload(), 300);
    };
  }
}

    showToast("Challenge note saved");

      return;
    }
    const keyBase = label.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || ("mt_goal_" + uid());
    let key = keyBase;
    let i = 2;
    while(tasks.some(task=>task.key===key)){
      key = `${keyBase}_${i++}`;
    }
    hard75.tasks = [...tasks, {key, label}];
    input.value = "";
    persist();
    showToast("Goal added");
    render75Hard();
  };
  wrap.querySelectorAll("[data-del-75-goal]").forEach(btn=>{

      const key = btn.getAttribute("data-del-75-goal") || "";
      hard75.tasks = tasks.filter(task=>task.key!==key);
      Object.keys(hard75.days || {}).forEach(day=>{
        if(hard75.days[day] && Object.prototype.hasOwnProperty.call(hard75.days[day], key)){
          delete hard75.days[day][key];
        }
      });
      persist();
      showToast("Goal removed");
      render75Hard();
    };
  });
}

  const challengeStats = get75HardStats();
  const resetStats = getResetStats();
  const activeChallenge = customChallenges.find(c=>c.id===activeChallengeId) || null;

  let detailHtml = "";
  if(mode==="train"){
    detailHtml = `
      <div class="card">
        <h2>Training</h2>
        <div class="small">Your workouts, templates, and training challenge tools live here.</div>
        <div class="quick-grid" style="margin-top:12px;">
          <div class="stat-chip"><div class="row-between"><div>This week</div><div class="badge-num">${weeklyProg.strengthSessions||0}/${weeklyProg.cardioSessions||0}</div></div><div class="small">Strength / cardio days</div></div>
          <div class="stat-chip"><div class="row-between"><div>Steps</div><div class="badge-num">${weeklyProg.steps||0}</div></div><div class="small">This week</div></div>
        </div>
        <div class="btn-row">
          <button class="btn primary" id="planOpenWorkoutBtn">Open training tools</button>
        </div>
      </div>
    `;
  } else if(mode==="challenge"){
    detailHtml = `
      <div class="card">
        <h2>Challenge</h2>
        <div class="small">Use this when you want a sharper, more structured push.</div>
        <div class="quick-grid" style="margin-top:12px;">
          <div class="stat-chip"><div class="row-between"><div>Today</div><div class="badge-num">${challengeStats.doneToday}/${challengeStats.totalTasks}</div></div><div class="small">Challenge items complete</div></div>
          <div class="stat-chip"><div class="row-between"><div>Progress</div><div class="badge-num">${challengeStats.completedDays}</div></div><div class="small">Completed days</div></div>
        </div>
        <div class="small" style="margin-top:12px;">${activeChallenge ? `Workout focus challenge: ${escapeHtml(activeChallenge.name)}` : "No workout focus challenge active right now."}</div>
        <div class="btn-row">
          <button class="btn primary" id="planOpenChallengeBtn">Open challenge tools</button>
        </div>
      </div>
    `;
  } else if(mode==="reset"){
    detailHtml = `
      <div class="card">
        <h2>Reset</h2>
        <div class="small">Movement keeps you from sinking. Care keeps you from hardening. Meaning keeps you from drifting.</div>
        <div class="quick-grid" style="margin-top:12px;">
          <div class="stat-chip"><div class="row-between"><div>Today</div><div class="badge-num">${resetStats.doneToday}/3</div></div><div class="small">Body / care / meaning</div></div>
          <div class="stat-chip"><div class="row-between"><div>Full days</div><div class="badge-num">${resetStats.fullDays}</div></div><div class="small">Last 28 days</div></div>
        </div>
        <div class="btn-row">
          <button class="btn primary" id="planOpenResetBtn">Open reset planner</button>
        </div>
      </div>
    `;
  } else {
    detailHtml = `
      <div class="card">
        <h2>How To Use This App</h2>
        <div class="small">Today is for doing. Plan is for shaping the week. Health is for body metrics. History is for review.</div>
        <div class="quick-grid" style="margin-top:12px;">
          <div class="stat-chip"><div class="row-between"><div>Training</div><div class="badge-num">${entries.filter(e=>(e.date||"").slice(0,10)===today).length}</div></div><div class="small">Workouts today</div></div>
          <div class="stat-chip"><div class="row-between"><div>Challenge</div><div class="badge-num">${challengeStats.doneToday}/${challengeStats.totalTasks}</div></div><div class="small">Items today</div></div>
          <div class="stat-chip"><div class="row-between"><div>Reset</div><div class="badge-num">${resetStats.doneToday}/3</div></div><div class="small">Anchors today</div></div>
        </div>
      </div>
    `;
  }

  wrap.innerHTML = `
    <div class="card hero-card">
      <div class="hero-head">
        <div>
          <div class="hero-kicker">Plan</div>
          <h2 class="hero-title">Shape the week, not the chaos</h2>
          <div class="small hero-sub">This is the calmer control center for training, challenges, and reset routines.</div>
        </div>
        <div class="score-pill">
          <div class="small">Weekly plan</div>
          <div class="big-score" style="margin:2px 0 0 0;">${escapeHtml(weeklyPlanLabel(today))}</div>
        </div>
      </div>
      <div class="segmented" style="margin-top:16px;">
        <button class="btn ${mode==="overview"?"soft":""}" data-plan-mode="overview">Overview</button>
        <button class="btn ${mode==="train"?"soft":""}" data-plan-mode="train">Train</button>
        <button class="btn ${mode==="challenge"?"soft":""}" data-plan-mode="challenge">Challenge</button>
        <button class="btn ${mode==="reset"?"soft":""}" data-plan-mode="reset">Reset</button>
      </div>
    </div>
    ${detailHtml}
  `;

  wrap.querySelectorAll("[data-plan-mode]").forEach(btn=>{
    btn.onclick=()=>{
      window._planMode = btn.getAttribute("data-plan-mode") || "overview";
      renderPlan();
    };
  });
  const openWorkoutBtn = wrap.querySelector("#planOpenWorkoutBtn");
  if(openWorkoutBtn) openWorkoutBtn.onclick=()=>showScreen("workout");
  const openChallengeBtn = wrap.querySelector("#planOpenChallengeBtn");
  if(openChallengeBtn) openChallengeBtn.onclick=()=>showScreen("75hard");
  const openResetBtn = wrap.querySelector("#planOpenResetBtn");
  if(openResetBtn) openResetBtn.onclick=()=>showScreen("reset");
}

function renderHistory(){
  const wrap=document.getElementById("screen-history");
  if(!wrap) return;

  const historyMode = window._historyMode || "all";
  const days = [];
  for(let i=0;i<28;i++){
    const day = addDaysISO(todayISO(), -i);
    const dayWorkouts = entries.filter(e=>(e.date||"").slice(0,10)===day);
    const dayHealth = bpLog.filter(e=>(e.date||"").slice(0,10)===day).length + hLog.filter(e=>(e.date||"").slice(0,10)===day).length;
    const dayMotivation = checkins.filter(e=>(e.date||"").slice(0,10)===day).length + gratitudeLog.filter(e=>(e.date||"").slice(0,10)===day).length + journalLog.filter(e=>(e.date||"").slice(0,10)===day).length;
    const habitCount = habitDefs.reduce((s,h)=>s+(lwDays?.[day]?.[h.key]?1:0),0);
    const totalPoints = dayWorkouts.reduce((s,e)=>s+minutesToPoints(Number(e.duration)||0),0) + dayHealth + dayMotivation;
    days.push({
      day,
      workoutCount: dayWorkouts.length,
      habitCount,
      healthCount: dayHealth,
      totalPoints,
      hasAny: dayWorkouts.length || habitCount || dayHealth || dayMotivation
    });
  }

  const filteredDays = days.filter(d=>{
    if(historyMode==="active") return d.hasAny;
    if(historyMode==="workouts") return d.workoutCount>0;
    return true;
  });
  let currentStreak = 0;
  for(const day of days){
    if(!day.hasAny) break;
    currentStreak += 1;
  }
  let longestStreak = 0;
  let running = 0;
  days.forEach(day=>{
    if(day.hasAny){
      running += 1;
      longestStreak = Math.max(longestStreak, running);
    } else {
      running = 0;
    }
  });
  const totalWorkoutPoints = days.reduce((s,d)=>s+d.totalPoints,0);
  const activeDays = days.filter(d=>d.hasAny).length;
  const recentBadges = achievements.filter(a=>a.type==="challenge_badge").slice(0,8);
  const recentWorkouts = entries.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,12);
  const records = computeRecords();

  wrap.innerHTML=`
    <div class="card hero-card">
      <div class="hero-head">
        <div>
          <div class="hero-kicker">History & Trends</div>
          <h2 class="hero-title">Your streaks and records</h2>
          <div class="small hero-sub">See how the last month is stacking up and where your best efforts happened.</div>
        </div>
        <div class="score-pill">
          <div class="small">Active days</div>
          <div class="big-score" style="margin:2px 0 0 0;">${activeDays}</div>
        </div>
      </div>
      <div class="quick-grid" style="margin-top:14px;">
        <div class="stat-chip"><div class="row-between"><div>Longest streak</div><div class="badge-num">${longestStreak}</div></div><div class="small">Days with any activity</div></div>
        <div class="stat-chip"><div class="row-between"><div>Current streak</div><div class="badge-num">${currentStreak}</div></div><div class="small">Including today</div></div>
        <div class="stat-chip"><div class="row-between"><div>28-day points</div><div class="badge-num">${totalWorkoutPoints}</div></div><div class="small">Workout, habits, health, notes</div></div>
        <div class="stat-chip"><div class="row-between"><div>Best week</div><div class="badge-num">${records.bestWeek.value || 0}</div></div><div class="small">${records.bestWeek.label || "No record yet"}</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Records</h2>
      <div class="record-grid">
        <div class="record-card">
          <div class="small">Longest workout</div>
          <div class="record-value">${records.longestWorkout.value || 0} min</div>
          <div class="small">${escapeHtml(records.longestWorkout.label || "No workout yet")} ${records.longestWorkout.date ? `- ${records.longestWorkout.date}` : ""}</div>
        </div>
        <div class="record-card">
          <div class="small">Most steps</div>
          <div class="record-value">${records.mostSteps.value || 0}</div>
          <div class="small">${records.mostSteps.date || "No step record yet"}</div>
        </div>
        <div class="record-card">
          <div class="small">Best week</div>
          <div class="record-value">${records.bestWeek.value || 0}</div>
          <div class="small">${records.bestWeek.label || "No weekly record yet"}</div>
        </div>
        <div class="record-card">
          <div class="small">Best month</div>
          <div class="record-value">${records.bestMonth.value || 0}</div>
          <div class="small">${records.bestMonth.label || "No monthly record yet"}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>History</h2>
      <div class="small">Your last 28 days at a glance.</div>
      <div class="segmented" style="margin-top:12px;">
        <button class="btn ${historyMode==="all"?"soft":""}" data-history-mode="all">All days</button>
        <button class="btn ${historyMode==="active"?"soft":""}" data-history-mode="active">Active only</button>
        <button class="btn ${historyMode==="workouts"?"soft":""}" data-history-mode="workouts">Workouts</button>
      </div>
    </div>

    <div class="card">
      <h2>Daily Rollup</h2>
      ${filteredDays.slice(0,10).map(day=>`
        <div class="list-row soft">
          <div style="flex:1;">
            <div style="font-weight:600;">${day.day}</div>
            <div class="small">${day.workoutCount} workouts - ${day.habitCount} habits - ${day.healthCount} health logs</div>
          </div>
          <div class="badge-num">${day.totalPoints}</div>
        </div>
      `).join("") || '<div class="small">No days match this filter yet.</div>'}
    </div>

    <div class="card">
      <h2>Recent Workouts</h2>
      ${recentWorkouts.length ? recentWorkouts.map(e=>`
        <div class="list-row soft">
          <div style="flex:1;">
            <div style="font-weight:600;">${escapeHtml((e.category||"Workout"))} - ${escapeHtml(e.date||"")}</div>
            <div class="small">${e.duration?`${escapeHtml(e.duration)} min - `:""}${e.km?`${escapeHtml(e.km)} km - `:""}${e.steps?`${escapeHtml(e.steps)} steps`:""}</div>
          </div>
          <div class="badge-num">${minutesToPoints(Number(e.duration)||0)}</div>
        </div>
      `).join("") : '<div class="small">No workouts logged yet.</div>'}
    </div>

    <div class="card">
      <h2>Challenge Badges</h2>
      ${recentBadges.length ? recentBadges.map(b=>`
        <div class="list-row soft">
          <div style="flex:1;">
            <div style="font-weight:600;">${escapeHtml(b.rewardName || "Badge")}</div>
            <div class="small">${escapeHtml(b.badgeTier || "Bronze")} tier - ${escapeHtml(b.name || "Challenge")} - ${escapeHtml((b.completedAt||"").slice(0,10))}</div>
          </div>
        </div>
      `).join("") : '<div class="small">Complete a custom challenge to earn a badge.</div>'}
    </div>
  `;

  wrap.querySelectorAll("[data-history-mode]").forEach(btn=>{
    btn.onclick=()=>{
      window._historyMode = btn.getAttribute("data-history-mode") || "all";
      renderHistory();
    };
  });
}

const screenRenderers = {
  overview: renderOverview,
  plan: renderPlan,
  health: renderHealth,
  lifestyle: renderLifestyle,
  workout: renderWorkout,
  "75hard": render75Hard,
  reset: renderReset,
  history: renderHistory
};

const renderedScreens = Object.create(null);
let activeScreen = "";

function renderScreen(name, force=false){
  const renderer = screenRenderers[name];
  if(!renderer) return;
  if(!force && renderedScreens[name]) return;
  try{
    renderer();
    renderedScreens[name] = true;
  }catch(err){
    const target = document.getElementById('screen-'+name);
    if(target){
      target.innerHTML = `<div class="card"><h2>Screen Error</h2><div class="small">${escapeHtml(String(err && err.message ? err.message : err))}</div></div>`;
    }
    showToast("Screen error");
    console.error(err);
  }
}

function showScreen(name){
  if(name===activeScreen) return;
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.remove('hidden');
  const navBtn = document.querySelector('.nav-btn[data-target="'+name+'"]');
  if(navBtn) navBtn.classList.add('active');
  activeScreen = name;
  if(name==="lifestyle"){
    window._lifeSelected = todayISO();
    renderScreen(name, true);
    return;
  }
  if(name==="history"){
    renderScreen(name, true);
    return;
  }
  renderScreen(name);
}
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    showScreen(btn.getAttribute('data-target'));
  });
});
try{
  showScreen("overview");
  maybeSendReminder();
}catch(err){
  const target = document.getElementById('screen-overview');
  if(target){
    target.innerHTML = `<div class="card"><h2>Startup Error</h2><div class="small">${escapeHtml(String(err && err.message ? err.message : err))}</div></div>`;
  }
  console.error(err);
}

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden") flushPersist();
  if(document.visibilityState === "visible") maybeSendReminder();
});
window.addEventListener("pagehide", flushPersist);
window.addEventListener("beforeunload", flushPersist);

if('serviceWorker' in navigator && /^https?:$/i.test(location.protocol)){
  navigator.serviceWorker.register('./service-worker.js').catch((err)=>console.error(err));
}
</script>
</body>
</html>
