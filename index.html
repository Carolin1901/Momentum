<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f141b" />
<title>Momentum</title>
<style>
:root {
  --bg:#0f141b;
  --bg-top:#161c25;
  --bg-deep:#0b1016;
  --card:#171f2a;
  --card-strong:#202a36;
  --border:rgba(196,214,233,.11);
  --border-strong:rgba(136,223,214,.22);
  --text:#f3f7fb;
  --dim:#9aa8b8;
  --accent:#37b7ac;
  --accent-2:#76ddd3;
  --accent-cool:#6eb7ba;
  --accent-soft:rgba(55,183,172,.16);
  --glow:0 18px 44px rgba(0,0,0,.34);
  --danger:#b6483b;
  --radius-lg:16px;
  --radius-md:12px;
  --radius-xl:24px;
  --pad-card:16px;
  --pad-screen:16px;
  --nav-h:70px;
  --font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
body{
  margin:0;
  background:
    radial-gradient(circle at 8% 0%, rgba(118,221,211,.16), transparent 26%),
    radial-gradient(circle at 92% 12%, rgba(55,183,172,.14), transparent 24%),
    radial-gradient(circle at 50% 100%, rgba(72,107,159,.12), transparent 28%),
    linear-gradient(180deg,var(--bg-top),var(--bg) 42%, var(--bg-deep));
  color:var(--text);
  font-family:var(--font-family);
  min-height:100vh;
  position:relative;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(120deg, rgba(255,255,255,.035), transparent 18%, transparent 82%, rgba(255,255,255,.02)),
    repeating-linear-gradient(180deg, rgba(255,255,255,.015) 0, rgba(255,255,255,.015) 1px, transparent 1px, transparent 84px);
  opacity:.42;
  mix-blend-mode:screen;
}
.screen{
  padding:var(--pad-screen);
  padding-bottom:calc(var(--nav-h) + 40px);
  max-width:600px;
  margin:0 auto;
  animation:screenIn .28s ease;
}
.card{
  background:
    linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.016)),
    linear-gradient(180deg,rgba(118,221,211,.025),transparent 42%),
    var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius-xl);
  box-shadow:var(--glow);
  backdrop-filter:blur(8px);
  padding:var(--pad-card);
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
.card::after{
  content:"";
  position:absolute;
  top:0;
  left:18px;
  right:18px;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
  opacity:.55;
}
.card h2{
  margin:0 0 8px 0;
  font-size:16px;
  font-weight:600;
  color:var(--text);
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:.4rem;
}
.small{
  font-size:12px;
  color:var(--dim);
  line-height:1.4;
}
.row-between{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:6px;
  font-size:14px;
}
.row-left{
  color:var(--text);
  font-weight:600;
}
.row-right{
  color:var(--text);
  font-weight:600;
  text-align:right;
}
.progress-bg{
  background:rgba(255,255,255,.08);
  border-radius:999px;
  height:10px;
  overflow:hidden;
  margin-top:12px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.28);
}
.progress-fg{
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  height:10px;
  width:0%;
  box-shadow:0 0 18px rgba(118,221,211,.22);
}
.big-score{
  font-size:30px;
  font-weight:800;
  color:var(--accent);
  margin:4px 0;
  letter-spacing:.01em;
  text-shadow:0 0 20px rgba(118,221,211,.12);
}
.subtle{
  color:var(--dim);
  font-size:14px;
  font-weight:400;
}
.input-label{
  color:var(--dim);
  font-size:12px;
  margin-bottom:4px;
  display:block;
}
.input, textarea.input, select.input{
  width:100%;
  background:linear-gradient(180deg,rgba(8,13,18,.94),rgba(16,22,31,.94));
  color:var(--text);
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:10px 12px;
  font-size:16px;
  margin-bottom:12px;
  font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
textarea.input{
  min-height:80px;
  resize:none;
}
.input:focus, textarea.input:focus, select.input:focus{
  outline:none;
  border-color:var(--border-strong);
  box-shadow:0 0 0 3px rgba(55,183,172,.14);
}
.btn-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px;
}
.btn{
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  padding:10px 16px;
  font-size:14px;
  color:var(--text);
  font-weight:600;
  min-height:44px;
  touch-action:manipulation;
  transition:transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
  box-shadow:0 8px 18px rgba(0,0,0,.16);
}
.btn:active{transform:scale(.98);}
.btn.danger{
  color:var(--danger);
  border-color:rgba(248,113,113,.6);
  background:linear-gradient(180deg,rgba(182,72,59,.12),rgba(255,255,255,.02));
}
.btn.primary{
  background:
    linear-gradient(135deg, rgba(118,221,211,.16), transparent 50%),
    linear-gradient(135deg,var(--accent),#21847c);
  border-color:rgba(118,221,211,.42);
  color:#fff7f1;
  box-shadow:0 14px 30px rgba(25,113,106,.28);
}
.btn.soft{
  background:linear-gradient(180deg,rgba(55,183,172,.14),rgba(255,255,255,.03));
  border-color:rgba(55,183,172,.22);
}
.list-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
  margin-bottom:8px;
  font-size:14px;
  color:var(--text);
  word-break:break-word;
}
.list-row .del{
  color:#f87171;
  font-size:14px;
  cursor:pointer;
  user-select:none;
}
.badge-num{
  font-weight:700;
  color:var(--accent);
}
.challenge-bar-bg{
  background:rgba(255,255,255,.09);
  border-radius:999px;
  height:8px;
  overflow:hidden;
  margin-top:6px;
}
.challenge-bar-fg{
  background:var(--accent);
  height:8px;
  width:0%;
}
.flex-col{
  display:flex;
  flex-direction:column;
}
.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:var(--nav-h);
  background:linear-gradient(180deg,rgba(16,22,31,.92),rgba(10,15,22,.96));
  border-top:1px solid rgba(255,255,255,.06);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:999;
  font-size:12px;
  backdrop-filter:blur(18px);
  box-shadow:0 -12px 34px rgba(0,0,0,.34);
}
.nav-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:var(--text);
  text-decoration:none;
  font-weight:500;
  background:none;
  border:0;
  padding:0;
  font-family:inherit;
  min-width:0;
  flex:1;
  font-size:11px;
  margin:6px;
  border-radius:16px;
  min-height:54px;
}
.nav-btn.active{
  color:var(--accent);
  background:linear-gradient(180deg,rgba(55,183,172,.18),rgba(255,255,255,.03));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.nav-emoji{
  font-size:20px;
  line-height:20px;
  margin-bottom:4px;
}
.hidden{display:none;}
.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.mini-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.stat-chip{
  border:1px solid var(--border);
  background:
    linear-gradient(180deg,rgba(118,221,211,.06),rgba(255,255,255,.02)),
    rgba(255,255,255,.02);
  border-radius:14px;
  padding:12px;
}
.stat-chip .small{
  margin-top:4px;
}
.calendar-strip{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:6px;
  margin-top:10px;
}
.calendar-day{
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 6px;
  text-align:center;
  background:rgba(255,255,255,.028);
}
.calendar-day.active{
  border-color:rgba(55,183,172,.34);
  background:linear-gradient(180deg,rgba(55,183,172,.18),rgba(255,255,255,.03));
}
.calendar-day.good{
  background:rgba(118,221,211,.09);
}
.calendar-day.empty{
  opacity:.65;
}
.sticky-actions{
  position:sticky;
  bottom:calc(var(--nav-h) + 12px);
  z-index:10;
}
.hero-card{
  background:
    radial-gradient(circle at top right, rgba(118,221,211,.18), transparent 34%),
    radial-gradient(circle at 10% 100%, rgba(55,183,172,.18), transparent 32%),
    linear-gradient(135deg, rgba(28,38,51,.98), rgba(13,19,28,.98));
  border-color:rgba(118,221,211,.14);
}
.hero-head{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:flex-start;
}
.hero-title{
  margin:0;
  font-size:31px;
  line-height:.98;
  letter-spacing:.015em;
  text-wrap:balance;
}
.hero-kicker{
  text-transform:uppercase;
  letter-spacing:.14em;
  font-size:11px;
  color:#b9ece6;
  margin-bottom:8px;
  font-weight:700;
}
.hero-sub{
  max-width:32ch;
  margin-top:8px;
}
.score-pill{
  min-width:96px;
  border-radius:18px;
  padding:12px 14px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.1);
  text-align:right;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.hero-grid{
  display:grid;
  grid-template-columns:1.4fr 1fr;
  gap:12px;
  margin-top:16px;
}
.hero-grid.tight{
  grid-template-columns:1.15fr .85fr;
  align-items:stretch;
}
.hero-split{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:14px;
  align-items:center;
  margin-top:14px;
}
.hero-copy{
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.hero-copy .hero-sub{
  max-width:28ch;
}
.hero-meta{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:14px;
}
.hero-mini{
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));
}
.hero-mini-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--dim);
  font-weight:700;
}
.hero-mini-value{
  font-size:20px;
  font-weight:800;
  color:var(--text);
  margin-top:6px;
}
.hero-mini-sub{
  font-size:12px;
  color:var(--dim);
  margin-top:4px;
}
.hero-panel{
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.025));
}
.hero-badges{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 10px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));
  font-size:12px;
  color:var(--text);
}
.tone-ready{color:#def9f6;border-color:rgba(55,183,172,.3);background:rgba(55,183,172,.15);}
.tone-steady{color:#ecfbf9;border-color:rgba(118,221,211,.26);background:rgba(118,221,211,.14);}
.tone-recovery{color:#d1dcdf;border-color:rgba(110,183,186,.18);background:rgba(110,183,186,.08);}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.week-plan{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:8px;
  margin-top:12px;
}
.day-pill{
  border:1px solid var(--border);
  border-radius:16px;
  padding:10px 8px;
  background:rgba(255,255,255,.03);
  text-align:center;
}
.day-pill.active{
  border-color:rgba(55,183,172,.3);
  background:linear-gradient(180deg,rgba(55,183,172,.15),rgba(255,255,255,.03));
}
.day-pill .small{display:block;margin-top:4px;}
.segmented{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}
.record-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:12px;
}
.record-card{
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));
}
.record-value{
  font-size:22px;
  font-weight:700;
  color:var(--accent);
  margin-top:8px;
}
.ring-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  min-height:260px;
}
.progress-ring{
  --pct:0;
  width:186px;
  height:186px;
  border-radius:50%;
  background:
    radial-gradient(circle at center, rgba(17,25,35,.98) 0 61%, transparent 62%),
    conic-gradient(var(--accent) calc(var(--pct) * 1%), rgba(255,255,255,.08) 0);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 0 1px rgba(255,255,255,.05), 0 16px 34px rgba(0,0,0,.24), inset 0 0 34px rgba(118,221,211,.07);
  position:relative;
}
.progress-ring::after{
  content:"";
  position:absolute;
  inset:13px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.06);
}
.ring-center{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}
.ring-label{
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--dim);
  font-weight:700;
}
.ring-value{
  font-size:42px;
  font-weight:800;
  line-height:.95;
  color:var(--text);
}
.ring-subvalue{
  font-size:12px;
  color:var(--dim);
}
.ring-caption{
  margin-top:12px;
  font-size:12px;
  color:#c8d7e5;
  letter-spacing:.12em;
  text-transform:uppercase;
  font-weight:700;
}
.summary-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:14px;
}
.summary-stat{
  border-top:1px solid rgba(255,255,255,.08);
  padding-top:12px;
}
.summary-kicker{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.14em;
  color:var(--dim);
  font-weight:700;
}
.summary-value{
  font-size:27px;
  font-weight:800;
  color:var(--text);
  margin-top:6px;
}
.summary-value.accent{
  color:var(--accent);
}
.summary-note{
  font-size:12px;
  color:var(--dim);
  margin-top:4px;
  line-height:1.4;
}
.stats-list{
  margin-top:10px;
}
.stats-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-top:1px solid rgba(255,255,255,.06);
}
.stats-row:first-child{
  border-top:0;
  padding-top:0;
}
.stats-label{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--dim);
  font-weight:700;
}
.stats-value{
  font-size:22px;
  font-weight:800;
  color:var(--text);
  text-align:right;
  max-width:52%;
  word-break:break-word;
}
.stats-sub{
  font-size:12px;
  color:var(--dim);
  margin-top:4px;
}
.visual-stack{
  display:grid;
  gap:12px;
  margin-top:14px;
}
.visual-card{
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));
}
.bar-meter{
  margin-top:10px;
}
.bar-meter-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:end;
}
.bar-meter-title{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--dim);
  font-weight:700;
}
.bar-meter-value{
  font-size:20px;
  font-weight:800;
  color:var(--text);
}
.bar-meter-sub{
  font-size:12px;
  color:var(--dim);
  margin-top:4px;
}
.mini-rings{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.mini-ring{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:12px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));
}
.mini-ring .progress-ring{
  width:104px;
  height:104px;
}
.mini-ring .progress-ring::after{
  inset:9px;
}
.mini-ring .ring-value{
  font-size:24px;
}
.mini-ring .ring-subvalue{
  font-size:11px;
}
.section-tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}
.section-tabs .small{
  padding:8px 12px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);
  letter-spacing:.08em;
  text-transform:uppercase;
  font-weight:700;
}
.list-row.soft{
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));
}
.fab-row{
  position:sticky;
  bottom:calc(var(--nav-h) + 12px);
  display:flex;
  gap:10px;
  z-index:11;
  margin-top:14px;
}
.fab-row .btn{
  flex:1;
  min-height:50px;
}
#toast {
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(var(--nav-h) + 16px);
  background:linear-gradient(135deg,var(--accent),#21847c);
  color:#fff8f2;
  font-size:14px;
  font-weight:600;
  padding:10px 16px;
  border-radius:999px;
  opacity:0;
  transition:opacity .25s;
  z-index:1000;
  box-shadow:0 14px 30px rgba(25,113,106,.32);
}
#toast.show{opacity:1;}
@keyframes screenIn{
  from{opacity:.55;transform:translateY(6px);}
  to{opacity:1;transform:none;}
}
@media (max-width: 480px){
  .quick-grid,
  .mini-grid,
  .hero-grid,
  .hero-split,
  .record-grid,
  .segmented,
  .mini-rings,
  .summary-grid{
    grid-template-columns:1fr;
  }
  .week-plan{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .screen{
    padding:14px;
    padding-bottom:calc(var(--nav-h) + 56px);
  }
  .hero-head{
    flex-direction:column;
  }
  .score-pill{
    width:100%;
    text-align:left;
  }
}
</style>
</head>
<body>

<div id="toast">Saved</div>

<div id="screen-overview" class="screen">
  <div class="card">
    <h2>Momentum</h2>
    <div class="small">Loading your dashboard...</div>
  </div>
</div>
<div id="screen-plan" class="screen hidden"></div>
<div id="screen-health" class="screen hidden"></div>
<div id="screen-lifestyle" class="screen hidden"></div>
<div id="screen-workout" class="screen hidden"></div>
<div id="screen-75hard" class="screen hidden"></div>

// helpers
function lsGet(key, fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback;}catch(e){return fallback;}}
function lsSet(key, val){localStorage.setItem(key, JSON.stringify(val));}
function todayISO(){
  const d=new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}

function weekStartISO(dateISO){
  const d = new Date((dateISO||todayISO())+"T00:00:00");
  const g = d.getDay();
  const diff = (g===0?-6:1)-g;
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  return d.toISOString().slice(0,10);
}
function addDaysISO(dateISO, n){
  const d = new Date(dateISO+"T00:00:00");
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function monthKey(dateISO){
  return (dateISO||todayISO()).slice(0,7); // YYYY-MM
}


function mondayOfThisWeekISO(){const d=new Date();const g=d.getDay();const diff=(g===0?-6:1)-g;d.setDate(d.getDate()+diff);d.setHours(0,0,0,0);return d.toISOString().slice(0,10);}
function uid(){return Math.random().toString(36).slice(2,10);}
function showToast(msg="Saved"){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);}

function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, s=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[s]));
}
function escapeAttr(str){ return escapeHtml(str); }

function minutesToPoints(min){
  const m = Number(min);
  if(!isFinite(m) || m < 15) return 0;
  return Math.floor(m/15);
}



function kmToMiles(km){ return (Number(km)||0) * 0.621371; }
function milesToKm(mi){ return (Number(mi)||0) * 1.60934; }
function fmtMiFromKm(km){
  const m = kmToMiles(km);
  return Math.round(m*10)/10;
}

function currentWeight(){
  if(!hLog.length) return null;
  return parseFloat(hLog[0].weight)||null;
}

function weightProgress(){
  if(weightStart==null || weightGoal==null) return null;
  const cw=currentWeight();
  if(cw==null) return null;
  const total = weightStart - weightGoal;
  if(total<=0) return null;
  const done = weightStart - cw;
  return Math.max(0, Math.min(100, Math.round((done/total)*100)));
}
function weightToGoal(){
  const cw=currentWeight();
  if(cw==null || weightGoal==null) return null;
  return Math.round((cw - weightGoal)*10)/10;
}

function weightLost(){
  if(weightStart==null) return null;
  const cw=currentWeight();
  if(cw==null) return null;
  return Math.round((weightStart - cw)*10)/10;
}

function toCSV(rows){
  if(!rows || !rows.length) return "";
  const esc = (v)=>{
    const s = (v===null || v===undefined) ? "" : String(v);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  };
  return rows.map(r=>r.map(esc).join(",")).join("\n");
}
function downloadCSV(filename, rows){
  const csvText = toCSV(rows);
  const blob = new Blob([csvText], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 500);
}

function getResetEntry(day){
  return Object.assign({body:false, care:false, meaning:false, note:""}, resetCompass?.days?.[day] || {});
}

function getResetStats(){
  const today = todayISO();
  const entry = getResetEntry(today);
  const doneToday = ["body","care","meaning"].reduce((sum,key)=>sum + (entry[key] ? 1 : 0), 0);
  let streak = 0;
  for(let i=0;i<60;i++){
    const day = addDaysISO(today, -i);
    const row = getResetEntry(day);
    if(row.body || row.care || row.meaning) streak += 1;
    else break;
  }
  let fullDays = 0;
  for(let i=0;i<28;i++){
    const day = addDaysISO(today, -i);
    const row = getResetEntry(day);
    if(row.body && row.care && row.meaning) fullDays += 1;
  }
  return {doneToday, streak, fullDays};
}

function get75HardEntry(day){
  return Object.assign({notes:""}, hard75?.days?.[day] || {});
}

function is75HardComplete(day){
  const row = get75HardEntry(day);
  return hard75TaskDefs().every(task=>!!row[task.key]);
}

function get75HardStats(){
  const today = todayISO();
  const tasks = hard75TaskDefs();
  const loggedDays = Object.keys(hard75?.days || {}).filter(Boolean).sort();
  const start = hard75.startDate || loggedDays[0] || today;
  const started = loggedDays.length > 0 || !!hard75.startDate;
  const daysInto = started ? Math.max(1, Math.floor((new Date(today+"T00:00:00") - new Date(start+"T00:00:00")) / 86400000) + 1) : 1;
  const currentEntry = get75HardEntry(today);
  const doneToday = tasks.reduce((sum, task)=>sum + (currentEntry[task.key] ? 1 : 0), 0);
  let completedDays = 0;
  let streak = 0;
  for(let i=0;i<75;i++){
    const day = addDaysISO(start, i);
    if(day > today) break;
    if(is75HardComplete(day)){
      completedDays += 1;
      if(day === addDaysISO(today, -streak)) streak += 1;
    }else if(day === addDaysISO(today, -streak)){
      break;
    }
  }
  return {
    started,
    start,
    daysInto,
    doneToday,
    totalTasks: tasks.length,
    completedDays,
    streak,
    percent: Math.max(0, Math.min(100, Math.round((completedDays / 75) * 100)))
  };
}

function getLaggingHabit(){
  const today = todayISO();
  let best = null;
  habitDefs.forEach(h=>{
    let lastDone = "";
    for(let i=0;i<45;i++){
      const day = addDaysISO(today, -i);
      if(lwDays?.[day]?.[h.key]){
        lastDone = day;
        break;
      }
    }
    const gap = lastDone ? Math.max(0, Math.round((new Date(today+"T00:00:00") - new Date(lastDone+"T00:00:00")) / 86400000)) : 99;
    if(!best || gap > best.gap) best = {key:h.key, label:h.label, gap, lastDone};
  });
  return best;
}

function computeRecords(){
  const longestWorkout = entries.reduce((best,e)=>{
    const dur = Number(e.duration)||0;
    if(dur > best.value) return {value:dur, label:(e.category||"Workout"), date:e.date||""};
    return best;
  }, {value:0,label:"",date:""});
  const mostSteps = entries.reduce((best,e)=>{
    const steps = Number(e.steps)||0;
    if(steps > best.value) return {value:steps, label:(e.category||"Steps"), date:e.date||""};
    return best;
  }, {value:0,label:"",date:""});
  const byWeek = {};
  const byMonth = {};
  entries.forEach(e=>{
    const day = (e.date||"").slice(0,10);
    if(!day) return;
    const points = minutesToPoints(Number(e.duration)||0);
    const wk = weekStartISO(day);
    const mk = day.slice(0,7);
    byWeek[wk] = (byWeek[wk]||0) + points;
    byMonth[mk] = (byMonth[mk]||0) + points;
  });
  let bestWeek = {value:0,label:""};
  Object.entries(byWeek).forEach(([label, value])=>{ if(value > bestWeek.value) bestWeek = {value, label}; });
  let bestMonth = {value:0,label:""};
  Object.entries(byMonth).forEach(([label, value])=>{ if(value > bestMonth.value) bestMonth = {value, label}; });
  return {longestWorkout, mostSteps, bestWeek, bestMonth};
}

const CHALLENGE_METRICS = {
  workout_points: {label:"Workout points", unit:"pts"},
  workout_count: {label:"Workouts", unit:"sessions"},
  workout_minutes: {label:"Workout minutes", unit:"min"},
  bike_miles: {label:"Bike miles", unit:"mi"},
  run_miles: {label:"Run miles", unit:"mi"},
  walk_miles: {label:"Walk miles", unit:"mi"},
  steps: {label:"Steps", unit:"steps"},
  strength_sessions: {label:"Strength sessions", unit:"sessions"},
  active_days: {label:"Active days", unit:"days"}
};

function challengeDateRange(startDate, endDate){
  const today = todayISO();
  const start = (startDate || today).slice(0,10);
  const end = (endDate || start).slice(0,10);
  return start <= end ? {start, end} : {start:end, end:start};
}

function firstDayOfMonthISO(dateISO){
  const base = (dateISO || todayISO()).slice(0,7);
  return `${base}-01`;
}

function lastDayOfMonthISO(dateISO){
  const base = (dateISO || todayISO()).slice(0,7);
  const dt = new Date(`${base}-01T00:00:00`);
  dt.setMonth(dt.getMonth() + 1, 0);
  return dt.toISOString().slice(0,10);
}

function challengeEntriesFor(challenge){
  const {start, end} = challengeDateRange(challenge?.startDate, challenge?.endDate);
  return entries.filter(e=>{
    const day = (e.date||"").slice(0,10);
    return day && day >= start && day <= end;
  });
}

function challengeMetricValue(metricKey, list){
  const items = Array.isArray(list) ? list : [];
  const milesFor = (e)=> (parseFloat(e.miles)||0) + kmToMiles(parseFloat(e.km)||0);
  const byCat = (re)=> items.filter(e=>re.test(String(e.category||"").toLowerCase()));
  switch(metricKey){
    case "workout_points":
      return items.reduce((s,e)=>s + minutesToPoints(Number(e.duration)||0),0);
    case "workout_count":
      return items.length;
    case "workout_minutes":
      return items.reduce((s,e)=>s + (Number(e.duration)||0),0);
    case "bike_miles":
      return byCat(/cycle|cycling|bike/).reduce((s,e)=>s + milesFor(e),0);
    case "run_miles":
      return byCat(/run|running/).reduce((s,e)=>s + milesFor(e),0);
    case "walk_miles":
      return byCat(/walk|hike/).reduce((s,e)=>s + milesFor(e),0);
    case "steps":
      return items.reduce((s,e)=>s + (Number(e.steps)||0),0);
    case "strength_sessions":
      return byCat(/strength|kettlebell|kb|push|circuit/).length;
    case "active_days":
      return new Set(items.map(e=>(e.date||"").slice(0,10)).filter(Boolean)).size;
    default:
      return 0;
  }
}

function formatChallengeValue(metricKey, value){
  if(/miles/.test(metricKey)) return String(Math.round((Number(value)||0) * 10) / 10);
  return String(Math.round(Number(value)||0));
}

function getChallengeProgress(challenge){
  if(!challenge) return {value:0,target:0,pct:0,label:"", unit:"", summary:"", pace:"", rangeLabel:"", daysLeft:0};
  const metric = CHALLENGE_METRICS[challenge.metric];
  const target = Number(challenge.target) || 0;
  if(!metric) return {value:0,target,pct:0,label:"", unit:"", summary:"", pace:"", rangeLabel:"", daysLeft:0};
  const {start, end} = challengeDateRange(challenge.startDate, challenge.endDate);
  const list = challengeEntriesFor(challenge);
  const value = Number(challengeMetricValue(challenge.metric, list) || 0);
  const pct = Math.min(100, Math.round((value / (target || 1)) * 100));
  const startMs = new Date(start+"T00:00:00").getTime();
  const endMs = new Date(end+"T23:59:59").getTime();
  const nowMs = Date.now();
  const totalDays = Math.max(1, Math.floor((endMs - startMs) / 86400000) + 1);
  const elapsedDays = Math.max(1, Math.min(totalDays, Math.floor((Math.min(nowMs, endMs) - startMs) / 86400000) + 1));
  const expected = target ? (target * (elapsedDays / totalDays)) : 0;
  const pace = !target ? "" : value >= target ? "Done" : value >= expected ? "On pace" : "Behind";
  const daysLeft = Math.max(0, Math.ceil((endMs - nowMs) / 86400000));
  return {
    value,
    target,
    pct,
    label:metric.label,
    unit:metric.unit,
    rangeLabel:`${start} to ${end}`,
    summary:`${formatChallengeValue(challenge.metric, value)} / ${formatChallengeValue(challenge.metric, target)} ${metric.unit}`,
    pace,
    daysLeft
  };
}

function renderProgressRing(label, value, subvalue, pct, caption){
  const safePct = Math.max(0, Math.min(100, Math.round(Number(pct)||0)));
  return `
    <div class="progress-ring" style="--pct:${safePct};">
      <div class="ring-center">
        <div class="ring-label">${escapeHtml(label || "")}</div>
        <div class="ring-value">${escapeHtml(String(value || "0"))}</div>
        <div class="ring-subvalue">${escapeHtml(subvalue || "")}</div>
      </div>
    </div>
    ${caption ? `<div class="ring-caption">${escapeHtml(caption)}</div>` : ""}
  `;
}

function getBadgeTier(metric, challengeName){
  const prior = achievements.filter(a=>
    a.type === "challenge_badge" &&
    a.metric === metric &&
    String(a.name || "").toLowerCase() === String(challengeName || "").toLowerCase()
  ).length;
  const nth = prior + 1;
  if(nth >= 5) return {tier:"Gold", nth};
  if(nth >= 3) return {tier:"Silver", nth};
  return {tier:"Bronze", nth};
}

function maybeCompleteCustomChallenge(){
  if(!activeChallengeId) return false;
  const idx = customChallenges.findIndex(c=>c.id===activeChallengeId);
  if(idx < 0) return false;
  const challenge = customChallenges[idx];
  if(challenge.completedAt) return false;
  const progress = getChallengeProgress(challenge);
  if(progress.value < progress.target || !progress.target) return false;

  const completedAt = new Date().toISOString();
  const badgeTier = getBadgeTier(challenge.metric, challenge.name);
  const rewardName = `${badgeTier.tier} ${challenge.name} badge`;
  customChallenges[idx] = Object.assign({}, challenge, {completedAt, rewardName, badgeTier:badgeTier.tier, completionCount:badgeTier.nth});
  achievements = [{
    id:uid(),
    type:"challenge_badge",
    name:challenge.name,
    rewardName,
    badgeTier:badgeTier.tier,
    completionCount:badgeTier.nth,
    completedAt,
    metric:challenge.metric,
    target:challenge.target
  }, ...achievements].slice(0, 50);
  maybeUnlock(`challenge_${challenge.id}`, rewardName);
  persist();
  showToast(`Challenge complete: ${challenge.name}`);
  return true;
}

function todayActivityCount(){
  return activitySummaryFor(todayISO()).activeCount;
}

function activitySummaryFor(day){
  const workoutCount = entries.filter(e=>(e.date||"").slice(0,10)===day).length;
  const healthCount = bpLog.filter(e=>(e.date||"").slice(0,10)===day).length + hLog.filter(e=>(e.date||"").slice(0,10)===day).length;
  const challengeEntry = get75HardEntry(day);
  const challengeCount = hard75TaskDefs().reduce((sum, task)=>sum + (challengeEntry[task.key] ? 1 : 0), 0);
  const workoutPoints = entries.filter(e=>(e.date||"").slice(0,10)===day).reduce((sum,e)=>sum + minutesToPoints(Number(e.duration)||0), 0);
  const points = workoutPoints + healthCount + challengeCount;
  return {
    workoutCount,
    healthCount,
    challengeCount,
    points,
    activeCount: workoutCount + healthCount + challengeCount,
    hasWorkout: workoutCount > 0,
    hasHealth: healthCount > 0,
    hasChallenge: challengeCount > 0,
    hasAny: workoutCount + healthCount + challengeCount > 0
  };
}

function getTodayReadiness(){
  return readinessLog[todayISO()] || {energy:3,soreness:3,sleep:"",note:""};
}

function readinessScoreFor(day){
  const row = readinessLog?.[day];
  if(!row) return null;
  const energy = Number(row.energy)||0;
  const soreness = Number(row.soreness)||0;
  const sleep = Number(row.sleep)||0;
  if(!energy && !soreness && !sleep) return null;
  const score = Math.round(((energy*20) + ((6-Math.min(5,Math.max(1,soreness||3)))*15) + Math.min(10, sleep)*4));
  return Math.max(0, Math.min(100, score));
}

function buildTodayPlan(){
  const score = readinessScoreFor(todayISO());
  if(score == null){
    return {
      label:"Set your recovery first",
      tone:"soft",
      text:"Log energy, soreness, and sleep to get a tailored plan.",
      actions:["Save recovery","Log workout"]
    };
  }
  if(score >= 78){
    return {
      label:"Push day",
      tone:"primary",
      text:"You look ready for a stronger session. Go for strength, intervals, or a longer cardio block.",
      actions:["Lift 45 min","Try a challenge set"]
    };
  }
  if(score >= 58){
    return {
      label:"Steady day",
      tone:"soft",
      text:"Aim for consistency: one workout and one or two challenge checkmarks is enough.",
      actions:["Walk or ride","Check challenge"]
    };
  }
  return {
    label:"Recovery day",
    tone:"soft",
    text:"Keep the streak alive with mobility, walking, hydration, and sleep.",
    actions:["Yoga 20","Take an easy walk"]
  };
}

async function maybeSendReminder(){
  if(!reminderSettings.enabled) return;
  const now = new Date();
  const today = todayISO();
  const time = String(reminderSettings.time || "19:00");
  const parts = time.split(":");
  const hours = Number(parts[0] || 0);
  const minutes = Number(parts[1] || 0);
  const due = new Date();
  due.setHours(hours, minutes, 0, 0);
  if(now < due) return;
  if(todayActivityCount() > 0) return;
  if(reminderSettings.lastNotified === today || reminderSettings.fallbackShown === today) return;

  if("Notification" in window && Notification.permission === "granted"){
    try{
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg){
        await reg.showNotification("Momentum check-in", {
          body:"Log a workout, challenge step, or health check today to keep your streak moving.",
          icon:"./icons/icon-192.png",
          badge:"./icons/icon-192.png",
          tag:"momentum-daily-reminder"
        });
        reminderSettings.lastNotified = today;
        reminderSettings.permission = Notification.permission;
        persist();
        return;
      }
    }catch(e){}
  }

  reminderSettings.fallbackShown = today;
  persist();
  showToast("Reminder: log a workout, challenge step, or health check today");
}

// scoring
function calcStrengthDensity(entry){
  const reps = (parseFloat(entry.reps)||0) + (parseFloat(entry.pushups)||0) + (parseFloat(entry.swings)||0);
  const mins = parseFloat(entry.duration)||0;
  if(!reps || !mins) return null;
  return Math.round((reps / mins)*10)/10;
}


function uniqueDaysCount(filterFn){
  const s=new Set();
  (entries||[]).forEach(e=>{
    const d=(e.date||"").slice(0,10);
    if(!d) return;
    if(filterFn(e)) s.add(d);
  });
  return s.size;
}

// Recompute session-type counters so "sessions" mean "days" (1 per day)
function recomputeSessionCounters(){
  const isYoga = (e)=> (String(e.category||"").toLowerCase().match(/yoga|stretch/) );
  const isStrength = (e)=> (String(e.category||"").toLowerCase().match(/strength|kettlebell|kb|push|circuit/) );
  const isCardio = (e)=> (String(e.category||"").toLowerCase().match(/cardio|row|cycle|running|bike|stair|stairs|climb/) );

  // weekly
  if(typeof weeklyProg==="object" && weeklyProg){
    weeklyProg.strengthSessions = uniqueDaysCount(isStrength);
    weeklyProg.cardioSessions   = uniqueDaysCount(isCardio);
    weeklyProg.yogaSessions     = uniqueDaysCount(isYoga);
  }

  // monthly
  if(typeof monthlyProg==="object" && monthlyProg){
    // Keep yogaSessions as days too
    monthlyProg.yogaSessions = uniqueDaysCount(isYoga);
  }

  // weekend warrior: count days within current weekend bucket if youâ€™re using it as per-day too.
  // If weekendProg has yogaSessions, make it per-day within weekend by filtering dates in weekend range.
  if(typeof weekendProg==="object" && weekendProg){
    // Weekend definition: Sat+Sun of current week epoch (weekEpoch)
    const we = new Date(weekEpoch || mondayOfThisWeekISO());
    const sat = new Date(we); sat.setDate(sat.getDate()+5);
    const sun = new Date(we); sun.setDate(sun.getDate()+6);
    const satKey = sat.toISOString().slice(0,10);
    const sunKey = sun.toISOString().slice(0,10);
    const inWeekend = (e)=>{
      const d=(e.date||"").slice(0,10);
      return d===satKey || d===sunKey;
    };
    const weekendYogaDays = new Set();
    (entries||[]).forEach(e=>{
      const d=(e.date||"").slice(0,10);
      if(!d || !inWeekend(e)) return;
      if(isYoga(e)) weekendYogaDays.add(d);
    });
    weekendProg.yogaSessions = weekendYogaDays.size;
  }
}

function rebuildDerivedProgress(){
  const thisMonth = monthKey(todayISO());
  monthlyProg = {swings:0,cyclingKm:0,distanceKm:0,walkKm:0,yogaSessions:0,mobilitySessions:0,pushups:0,floors:0};
  weeklyProg = {strengthSessions:0,cardioSessions:0,distanceKm:0,rowingKm:0,reps:0,plankSec:0,mobilitySessions:0,floors:0,steps:0};
  weekendProg = {swings:0,distanceKm:0,footKm:0,yogaSessions:0,reps:0,circuitEx:0,strengthSessions:0};

  (entries||[]).forEach(rec=>{
    const dateKey = (rec.date||"").slice(0,10);
    if(!dateKey) return;
    const cat = String(rec.category||"").toLowerCase();
    const kmVal = (parseFloat(rec.km)||0) + (parseFloat(rec.miles)||0)*1.60934;
    const swingsVal = parseFloat(rec.swings)||0;
    const pushupsVal = parseFloat(rec.pushups)||0;
    const floorsVal = parseFloat(rec.floors)||0;
    const plankVal = parseFloat(rec.plank)||0;
    const stepsVal = parseFloat(rec.steps)||0;
    const circuitExVal = parseFloat(rec.circuitEx)||0;
    const isYoga = /yoga|stretch/.test(cat);
    const isCurrentWeek = dateKey >= weekEpoch && dateKey < addDaysISO(weekEpoch, 7);
    const wd = new Date(dateKey+"T00:00:00").getDay();
    const isWeekend = wd===6 || wd===0;

    if(dateKey.slice(0,7)===thisMonth){
      monthlyProg.swings += swingsVal;
      monthlyProg.cyclingKm += /cycle|bike|cycling/.test(cat) ? kmVal : 0;
      monthlyProg.walkKm += /walk/.test(cat) ? kmVal : 0;
      monthlyProg.pushups += pushupsVal;
      if(isYoga) monthlyProg.mobilitySessions += 1;
    }

    if(isCurrentWeek){
      weeklyProg.floors += floorsVal;
      weeklyProg.distanceKm += /running|row|cycle|bike|cycling/.test(cat) ? kmVal : 0;
      weeklyProg.rowingKm += /row/.test(cat) ? kmVal : 0;
      weeklyProg.steps += stepsVal;
      weeklyProg.plankSec += plankVal;
      if(isYoga) weeklyProg.mobilitySessions += 1;
    }

    if(isWeekend){
      weekendProg.swings += swingsVal;
      weekendProg.distanceKm += kmVal;
      weekendProg.circuitEx += circuitExVal;
      if(/walk|running|hike/.test(cat)) weekendProg.footKm += kmVal;
    }
  });

  recomputeSessionCounters();
}




function computeWorkoutPoints(weekStart){
  return entries.filter(e=>e.date>=weekStart).reduce((sum,e)=>{
    const mins=Number(e.duration)||0;
    const pts=minutesToPoints(mins);
    return sum+pts;
  },0);
}
function registerActivity(){ /* no-op: used by habit tracking */ }

function computeChallengePoints(weekStart){
  // Lifestyle scoring (simple + consistent):
  // Per habit per week:
  //   0â€“4 days = 0 pts
  //   5â€“6 days = 5 pts
  //   7 days   = 10 pts
  const end = addDaysISO(weekStart, 7);
  return Object.keys(hard75?.days || {}).filter(day=>day>=weekStart && day<end).reduce((sum, day)=>{
    const row = hard75.days[day] || {};
    return sum + hard75TaskDefs().reduce((taskSum, task)=>taskSum + (row[task.key] ? 1 : 0), 0);
  }, 0);
}
function computeHealthPoints(weekStart){
  return bpLog.filter(r=>r.date>=weekStart).length + hLog.filter(r=>r.date>=weekStart).length;
}
function computeBonus(weekStart){
  let bonus=0;
  const workoutsThisWeek = entries.filter(e=>e.date>=weekStart).length;
  if(workoutsThisWeek>=3) bonus+=10;
  const challengeDays = Object.keys(hard75?.days || {}).filter(day=>day>=weekStart && day<addDaysISO(weekStart, 7)).filter(day=>is75HardComplete(day)).length;
  if(challengeDays>=3) bonus+=10;
  const healthLogsThisWeek = bpLog.filter(r=>r.date>=weekStart).length + hLog.filter(r=>r.date>=weekStart).length;
  if(healthLogsThisWeek>=3) bonus+=5;
  const last3=bpLog.slice(0,3);
  if(last3.length===3){
    const avgS=Math.round(last3.reduce((s,x)=>s+(parseFloat(x.sys)||0),0)/3);
    const avgD=Math.round(last3.reduce((s,x)=>s+(parseFloat(x.dia)||0),0)/3);
    if(avgS<120 && avgD<80) bonus+=15;
  }
  return bonus;
}
function calcWeekComponents(weekStart){
  const workoutPts=computeWorkoutPoints(weekStart);
  const challengePts=computeChallengePoints(weekStart);
  const healthPts=computeHealthPoints(weekStart);
  const bonusPts=computeBonus(weekStart);
  const total=workoutPts+challengePts+healthPts+bonusPts;
  return {workoutPts,challengePts,healthPts,bonusPts,total};
}
function calcWeekTotalPoints(weekStart){
  return calcWeekComponents(weekStart).total;
}

function persist(immediate=false){
  if(immediate){
    flushPersist();
    return;
  }
  if(persistTimer) clearTimeout(persistTimer);
  persistTimer = setTimeout(flushPersist, 120);
}

function exportMomentumData(){
  const data = {};
  MOMENTUM_DATA_KEYS.forEach(k=>{
    const v = localStorage.getItem(k);
    if(v !== null) data[k] = v; // store raw strings so import is lossless
  });
  return JSON.stringify({version:1, exported_at: new Date().toISOString(), data}, null, 2);
}

function importMomentumDataFromText(txt){
  try{
    const obj = JSON.parse(txt);
    const payload = obj && obj.data ? obj.data : obj;
    if(!payload || typeof payload !== "object") return false;
    Object.keys(payload).forEach(k=>{
      if(payload[k] === null || payload[k] === undefined) return;
      localStorage.setItem(k, String(payload[k]));
    });
    return true;
  }catch(e){
    return false;
  }
}

function downloadTextFile(filename, content, mime){
  const blob = new Blob([content], {type: (mime||"text/plain;charset=utf-8;")});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 500);
}

// LIFESTYLE (date picker + per-day checkboxes stored by date)
function renderLifestyle(){
  const wrap=document.getElementById("screen-lifestyle");
  const HABITS = normalizeHabitDefs(habitDefs);
  habitDefs = HABITS;

  function iso(d){ return d.toISOString().slice(0,10); }
  function parseISO(s){ const d=new Date((s||todayISO())+"T00:00:00"); d.setHours(0,0,0,0); return d; }
  function weekStartFromISO(s){
    const d=parseISO(s);
    const g=d.getDay();
    const diff=(g===0?-6:1)-g;
    d.setDate(d.getDate()+diff);
    return iso(d);
  }
  function addDays(isoStr, n){
    const d=parseISO(isoStr); d.setDate(d.getDate()+n); return iso(d);
  }

  let selectedDate = window._lifeSelected || todayISO();
  window._lifeSelected = selectedDate;
  lwEpoch = weekStartFromISO(selectedDate);
  const weekStart = lwEpoch;
  const days=[0,1,2,3,4,5,6].map(i=>addDays(weekStart,i));
  const dayLabels=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

  function getCell(dateISO, habitKey){
    return !!(lwDays?.[dateISO]?.[habitKey]);
  }
  function setCell(dateISO, habitKey, val){
    lwDays[dateISO]=lwDays[dateISO]||{};
    lwDays[dateISO][habitKey]=val;
  }
  function countHabitWeek(habitKey){
    return days.reduce((s,d)=>s+(getCell(d,habitKey)?1:0),0);
  }
  function habitWeekPoints(habitKey){
    const c=countHabitWeek(habitKey);
    if(c>=7) return 10;
    if(c>=5) return 5;
    return 0;
  }

  const weekPoints = HABITS.reduce((s,h)=>s+habitWeekPoints(h.key),0);
  const maxWeekPoints = HABITS.length * 10;
  const pct = Math.min(100, Math.round((weekPoints/(maxWeekPoints||1))*100));
  const todayKey = todayISO();
  const todayChecks = HABITS.reduce((s,h)=>s+(lwDays?.[todayKey]?.[h.key]?1:0),0);
  const selectedChecks = HABITS.reduce((s,h)=>s+(lwDays?.[selectedDate]?.[h.key]?1:0),0);

  function anyHabitStreak(){
    const end = parseISO(todayISO());
    let cur = new Date(end);
    let streak=0;
    for(let i=0;i<365;i++){
      const dk=iso(cur);
      const row=lwDays?.[dk]||{};
      const any = HABITS.some(h=>!!row[h.key]);
      if(any) streak++;
      else break;
      cur.setDate(cur.getDate()-1);
    }
    return streak;
  }
  const overallStreak = anyHabitStreak();

  wrap.innerHTML=`
    <div class="card">
      <h2>Lifestyle</h2>
      <div class="small">Today-first habit tracking with editable habits.</div>
      <div class="quick-grid" style="margin-top:12px;">
        <div class="stat-chip">
          <div class="row-between"><div>Today</div><div class="badge-num">${todayChecks}/${HABITS.length}</div></div>
          <div class="small">Habits checked</div>
        </div>
        <div class="stat-chip">
          <div class="row-between"><div>Streak</div><div class="badge-num">${overallStreak}</div></div>
          <div class="small">Days with any habit</div>
        </div>
        <div class="stat-chip">
          <div class="row-between"><div>Week points</div><div class="badge-num">${weekPoints}/${maxWeekPoints}</div></div>
          <div class="small">5/7 = 5 pts, 7/7 = 10 pts</div>
        </div>
      </div>
      <div style="margin-top:14px;">
        <label class="input-label">Date</label>
        <input class="input" id="lifeDate" type="date" value="${selectedDate}"/>
        <div class="small" style="margin-top:-6px;">Selected: <span class="badge-num">${selectedChecks}</span> / ${HABITS.length}</div>
      </div>
      <div class="progress-bg"><div class="progress-fg" style="width:${pct}%;"></div></div>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn danger" id="resetWeekBtn">Reset this week</button>
      </div>
    </div>

    <div class="card">
      <h2>Habits</h2>
      ${HABITS.map(h=>{
        const done=countHabitWeek(h.key);
        const isOn=getCell(selectedDate,h.key);
        const p=Math.min(100, Math.round((done/7)*100));
        const pts=habitWeekPoints(h.key);
        return `
          <div style="margin-bottom:14px;">
            <div class="row-between" style="align-items:center;">
              <div style="flex:1; font-size:14px;">${escapeHtml(h.label)}</div>
              <div class="small" style="margin-right:8px;">${done}/7${pts?` - <span class="badge-num">${pts} pts</span>`:""}</div>
              <label style="display:inline-flex;align-items:center;gap:8px;">
                <input type="checkbox" data-habit="${h.key}" ${isOn?"checked":""} style="transform:scale(1.2);"/>
              </label>
            </div>
            <div class="challenge-bar-bg"><div class="challenge-bar-fg" style="width:${p}%;"></div></div>
          </div>
        `;
      }).join("")}
    </div>

    <div class="card">
      <h2>Habits</h2>
      <div class="small">Make this app fit your real routines.</div>
      ${HABITS.map(h=>`
        <div class="list-row">
          <div style="flex:1;">${escapeHtml(h.label)}</div>
          <button class="btn danger" data-del-habit="${h.key}">Delete</button>
        </div>
      `).join("")}
      <input class="input" id="newHabitLabel" placeholder="Add a new habit"/>
      <div class="btn-row">
        <button class="btn" id="addHabitBtn">Add habit</button>
      </div>
    </div>

    <div class="card">
      <h2>This Week</h2>
      <div class="small">Checks per day for the week of ${weekStart}</div>
      ${days.map((d,i)=>{
        const row=lwDays?.[d]||{};
        const c=HABITS.reduce((s,h)=>s+(row[h.key]?1:0),0);
        const isSel = d===selectedDate;
        return `<div class="list-row" style="${isSel ? "background:rgba(47,159,150,.14);padding:8px 10px;border-radius:12px;" : ""}">
          <div style="flex:1;">${dayLabels[i]} - ${d}</div>
          <div class="badge-num">${c}</div>
        </div>`;
      }).join("")}
    </div>
  `;

  const dp = wrap.querySelector("#lifeDate");
  if(dp){
    dp.onchange=(ev)=>{
      const v=(ev.target.value || todayISO());
      window._lifeSelected = v;
      renderLifestyle();
    };
  }

  wrap.querySelectorAll('input[type="checkbox"][data-habit]').forEach(cb=>{
    cb.onchange=()=>{
      const key=cb.getAttribute("data-habit");
      const dateKey = wrap.querySelector("#lifeDate")?.value || todayISO();
      setCell(dateKey,key,cb.checked);
      window._lifeSelected = dateKey;
      maybeCompleteCustomChallenge();
      persist();
      showToast("Saved");
      renderLifestyle();
    };
  });

  const resetBtn = wrap.querySelector("#resetWeekBtn");
  if(resetBtn){
    resetBtn.onclick=()=>{
      days.forEach(d=>{ delete lwDays[d]; });
      persist();
      showToast("Week reset");
      renderLifestyle();
    };
  }

  wrap.querySelector("#addHabitBtn").onclick=()=>{
    const label = (wrap.querySelector("#newHabitLabel").value||"").trim();
    if(!label) return;
    const keyBase = label.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"") || ("habit_" + uid());
    let key = keyBase;
    let i = 2;
    while(habitDefs.some(h=>h.key===key)){
      key = `${keyBase}_${i++}`;
    }
    habitDefs = [...habitDefs, {key, label, icon:"Habit"}];
    persist();
    showToast("Habit added");
    renderLifestyle();
  };

  wrap.querySelectorAll("[data-del-habit]").forEach(btn=>{
    btn.onclick=()=>{
      const key = btn.getAttribute("data-del-habit");
      habitDefs = habitDefs.filter(h=>h.key!==key);
      Object.keys(lwDays||{}).forEach(day=>{
        if(lwDays[day] && key in lwDays[day]) delete lwDays[day][key];
      });
      persist();
      showToast("Habit removed");
      renderLifestyle();
    };
  });
}

        if(catSel.value==="Steps") stepsWrap.classList.remove("hidden");

          stepsWrap.classList.add("hidden");
          if(stepsInput) stepsInput.value="";

  wrap.querySelectorAll("[data-preset]").forEach(btn=>{

      wrap.querySelector("#wDate").value = todayISO();
      if(catSel){
        catSel.value = preset.category;
        catSel.onchange();
      }
      if(wrap.querySelector("#wSteps")) wrap.querySelector("#wSteps").value = preset.steps || "";
      wrap.querySelector("#wDur").value = preset.duration || "";
      wrap.querySelector("#wKm").value = preset.km || "";
      wrap.querySelector("#wMiles").value = preset.miles || "";
      wrap.querySelector("#wFloors").value = preset.floors || "";
      wrap.querySelector("#wSwings").value = preset.swings || "";
      wrap.querySelector("#wPlank").value = preset.plank || "";

      wrap.querySelector("#wReps").value = preset.reps || "";
      wrap.querySelector("#wCircuitEx").value = preset.circuitEx || "";
      showToast(`${preset.label} loaded`);
    };
  });

  if(wrap.querySelector("#clearActiveChallengeBtn")){
    wrap.querySelector("#clearActiveChallengeBtn").onclick=()=>{
      activeChallengeId = "";
      persist();
      showToast("Active challenge cleared");
      renderWorkout();
    };
  }

  wrap.querySelector("#saveCustomChallengeBtn").onclick=()=>{
    const name = (wrap.querySelector("#customChallengeName").value||"").trim();
    const metric = wrap.querySelector("#customChallengeMetric").value || "workout_points";
    const target = Number(wrap.querySelector("#customChallengeTarget").value)||0;
    const startDate = (wrap.querySelector("#customChallengeStart").value||challengeStartDefault).trim();
    const endDate = (wrap.querySelector("#customChallengeEnd").value||challengeEndDefault).trim();
    if(!name || !target || !startDate || !endDate){
      showToast("Add name, target, and dates");
      return;
    }
    const challenge = {id:uid(), name, metric, target, startDate, endDate};
    customChallenges = [challenge, ...customChallenges].slice(0, 12);
    activeChallengeId = challenge.id;
    maybeCompleteCustomChallenge();
    persist();
    showToast("Challenge saved");
    renderWorkout();
  };

  wrap.querySelectorAll("[data-activate-challenge]").forEach(btn=>{
    btn.onclick=()=>{
      activeChallengeId = btn.getAttribute("data-activate-challenge") || "";
      maybeCompleteCustomChallenge();
      persist();
      showToast("Challenge activated");
      renderWorkout();
    };
  });

  wrap.querySelectorAll("[data-del-challenge]").forEach(btn=>{
    btn.onclick=()=>{
      const id = btn.getAttribute("data-del-challenge") || "";
      customChallenges = customChallenges.filter(ch=>ch.id!==id);
      if(activeChallengeId === id) activeChallengeId = "";
      persist();
      showToast("Challenge removed");
      renderWorkout();
    };
  });

  wrap.querySelector("#goalInput").onchange=(ev)=>{
    goal = Number(ev.target.value)||0;
    persist();
    showToast("Goal updated");
    renderWorkout();
  };

  wrap.querySelector("#addWorkoutBtn").onclick=()=>{
    const rec={
      id:uid(),
      date:wrap.querySelector("#wDate").value.trim(),
      category:(()=>{
        const sel=wrap.querySelector("#wCatSelect");
        const val=(sel?sel.value:"").trim();
        if(val==="Other") return (wrap.querySelector("#wCatOther")?.value||"").trim();
        localStorage.last_cat = val;
        return val;
      })(),
      steps:(wrap.querySelector("#wSteps")?.value||"").trim(),
      duration:wrap.querySelector("#wDur").value.trim(),
      km:wrap.querySelector("#wKm").value.trim(),
      miles:wrap.querySelector("#wMiles").value.trim(),
      floors:wrap.querySelector("#wFloors").value.trim(),
      swings:wrap.querySelector("#wSwings").value.trim(),
      plank:wrap.querySelector("#wPlank").value.trim(),
      pushups:wrap.querySelector("#wPushups").value.trim(),
      reps:wrap.querySelector("#wReps").value.trim(),
      circuitEx:wrap.querySelector("#wCircuitEx").value.trim(),
      notes:""
    };
    addWorkoutRecord(rec);
    renderWorkout();
  };

  wrap.querySelectorAll("[data-del-workout]").forEach(btn=>{
    btn.onclick=()=>{
      const id = btn.getAttribute("data-del-workout") || "";
      entries=entries.filter(x=>x.id!==id);
      rebuildDerivedProgress();
      persist();
      showToast("Workout removed");
      renderWorkout();
    };
  });

  const backupText = wrap.querySelector("#backupText");
  const exportBtn = wrap.querySelector("#exportDataBtn");
  const downloadBtn = wrap.querySelector("#downloadDataBtn");
  const copyBtn = wrap.querySelector("#copyDataBtn");
  const importBtn = wrap.querySelector("#importDataBtn");

  if(exportBtn && backupText){
    exportBtn.onclick=()=>{
      backupText.value = exportMomentumData();
      lastBackupExport = {date: todayISO(), text: backupText.value};
      persist();
      showToast("Backup generated");
    };
  }
  if(downloadBtn && backupText){
    downloadBtn.onclick=()=>{
      const txt = backupText.value && backupText.value.trim() ? backupText.value : exportMomentumData();
      if(backupText) backupText.value = txt;
      lastBackupExport = {date: todayISO(), text: txt};
      persist();
      downloadTextFile(`momentum_backup_${todayISO()}.json`, txt, "application/json;charset=utf-8;");
      showToast("Downloaded");
    };
  }
  if(copyBtn && backupText){
    copyBtn.onclick=async ()=>{
      const txt = backupText.value || "";
      if(!txt.trim()){ showToast("Nothing to copy"); return; }
      try{
        await navigator.clipboard.writeText(txt);
        showToast("Copied");
      }catch(e){
        backupText.focus(); backupText.select();
        document.execCommand("copy");
        showToast("Copied");
      }
    };
  }
  if(importBtn && backupText){
    importBtn.onclick=()=>{
      const txt = (backupText.value||"").trim();
      if(!txt){ showToast("Paste backup JSON first"); return; }
      const ok = importMomentumDataFromText(txt);
      if(!ok){ showToast("Invalid JSON"); return; }
      showToast("Imported - reloading...");
      setTimeout(()=>location.reload(), 300);
    };
  }
}

function render75Hard(){

  for(let i=0;i<7;i++){
    const day = addDaysISO(today, -i);
    const row = get75HardEntry(day);
    const done = tasks.reduce((sum, task)=>sum + (row[task.key] ? 1 : 0), 0);
    recentDays.push({day, done, complete:is75HardComplete(day)});
  }

  wrap.innerHTML=`
    <div class="card hero-card">
      <div class="hero-head">
        <div>
          <div class="hero-kicker">🎯 Challenge</div>

          <div class="small hero-sub">Track a structured discipline challenge with goals you can shape to fit your life.</div>
        </div>
        <div class="score-pill">
          <div class="small">Completed</div>
          <div class="big-score" style="margin:2px 0 0 0;">${stats.completedDays}</div>
        </div>
      </div>
      <div class="quick-grid" style="margin-top:14px;">
        <div class="stat-chip"><div class="row-between"><div>Today</div><div class="badge-num">${stats.doneToday}/${stats.totalTasks}</div></div><div class="small">Tasks checked</div></div>
        <div class="stat-chip"><div class="row-between"><div>Streak</div><div class="badge-num">${stats.streak}</div></div><div class="small">Completed days in a row</div></div>
        <div class="stat-chip"><div class="row-between"><div>Date</div><div class="badge-num">${selectedDay.slice(5)}</div></div><div class="small">Editing this day</div></div>
        <div class="stat-chip"><div class="row-between"><div>Progress</div><div class="badge-num">${stats.percent}%</div></div><div class="small">${stats.completedDays}/75 full days</div></div>
      </div>
    </div>

    <div class="card">
      <h2>🗓️ Date</h2>
      <label class="input-label">Challenge date</label>
      <input class="input" id="hard75Date" type="date" value="${escapeAttr(selectedDay)}">
      <div class="btn-row">
        <button class="btn primary" id="save75DateBtn">Open date</button>
        <button class="btn danger" id="reset75Btn">Reset plan</button>
      </div>
    </div>

    <div class="card">
      <h2>✅ Daily Checklist</h2>
      <div class="small">Check each item when it feels honestly complete for ${selectedDay}.</div>
      ${tasks.map(task=>`
        <label class="list-row soft" style="align-items:center;">
          <div style="flex:1;">${task.label}</div>
          <input type="checkbox" data-75-task="${task.key}" ${entry[task.key] ? "checked" : ""} style="transform:scale(1.2);">
        </label>
      `).join("")}
      <label class="input-label" style="margin-top:10px;">Daily note</label>
      <textarea class="input" id="hard75Note" placeholder="What felt strong that day?">${escapeHtml(entry.notes || "")}</textarea>
      <div class="btn-row">
        <button class="btn" id="save75NoteBtn">Save note</button>
      </div>
    </div>

    <div class="card">
      <h2>🧩 Your Goals</h2>
      <div class="small">Customize this checklist so it matches the kind of challenge you actually want to keep.</div>
      ${tasks.map(task=>`
        <div class="list-row soft">
          <div style="flex:1;">${escapeHtml(task.label)}</div>
          <button class="btn danger" type="button" data-del-75-goal="${task.key}">Delete</button>
        </div>
      `).join("")}
      <input class="input" id="new75Goal" placeholder="Add a new daily goal">
      <div class="btn-row">
        <button class="btn" id="add75GoalBtn">Add goal</button>
      </div>
    </div>

    <div class="card">
      <h2>📆 Last 7 Days</h2>
      ${recentDays.map(day=>`
        <div class="list-row soft">
          <div style="flex:1;">
            <div style="font-weight:600;">${day.day}</div>
            <div class="small">${day.done}/${tasks.length} items ${day.complete ? "- full day" : ""}</div>
          </div>
          <div class="badge-num">${day.complete ? "Done" : day.done}</div>
        </div>
      `).join("")}
    </div>
  `;

  wrap.querySelector("#save75DateBtn").onclick=()=>{
    window._challengeDate = wrap.querySelector("#hard75Date").value || today;
    render75Hard();
  };
  wrap.querySelector("#hard75Date").onchange=()=>{
    window._challengeDate = wrap.querySelector("#hard75Date").value || today;
    render75Hard();
  };
  wrap.querySelector("#reset75Btn").onclick=()=>{
    hard75 = default75HardState();
    window._challengeDate = today;
    persist();
    showToast("Challenge reset");
    render75Hard();
  };
  wrap.querySelectorAll("[data-75-task]").forEach(box=>{
    box.onchange=()=>{
      hard75.days = hard75.days || {};
      hard75.days[selectedDay] = Object.assign({notes: entry.notes || ""}, hard75.days[selectedDay] || {}, {[box.getAttribute("data-75-task")]: box.checked});
      persist();
      showToast("Checklist updated");
      render75Hard();
    };
  });
  wrap.querySelector("#save75NoteBtn").onclick=()=>{
    hard75.days = hard75.days || {};
    hard75.days[selectedDay] = Object.assign({}, hard75.days[selectedDay] || {}, {notes:(wrap.querySelector("#hard75Note").value || "").trim()});
    persist();
    showToast("Challenge note saved");
    render75Hard();
  };
  wrap.querySelector("#add75GoalBtn").onclick=()=>{
    const input = wrap.querySelector("#new75Goal");
    const label = (input.value || "").trim();
    if(!label){
      showToast("Add a goal name");
      return;
    }
    const keyBase = label.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || ("mt_goal_" + uid());
    let key = keyBase;
    let i = 2;
    while(tasks.some(task=>task.key===key)){
      key = `${keyBase}_${i++}`;
    }
    hard75.tasks = [...tasks, {key, label}];
    input.value = "";
    persist();
    showToast("Goal added");
    render75Hard();
  };
  wrap.querySelectorAll("[data-del-75-goal]").forEach(btn=>{
    btn.onclick=()=>{
      const key = btn.getAttribute("data-del-75-goal") || "";
      hard75.tasks = tasks.filter(task=>task.key!==key);
      Object.keys(hard75.days || {}).forEach(day=>{
        if(hard75.days[day] && Object.prototype.hasOwnProperty.call(hard75.days[day], key)){
          delete hard75.days[day][key];
        }
      });
      persist();
      showToast("Goal removed");
      render75Hard();
    };
  });
}

        <div class="stat-chip"><div class="row-between"><div>Meaning</div><div class="badge-num">${entry.meaning ? "Done" : "Open"}</div></div><div class="small">${escapeHtml(todayPlan.meaning || "Choose one thing that matters")}</div></div>

    <div class="card">
      <h2>Why this works</h2>
      <div class="list-row soft"><div style="flex:1;"><strong>Movement</strong><div class="small">Keeps you from sinking. Walks, runs, yoga, stretching, anything that gets you out of your head and into your body.</div></div></div>
      <div class="list-row soft"><div style="flex:1;"><strong>Care</strong><div class="small">Keeps life softer and more held together. Clean sheets, skincare, grocery shop, tidy room, haircut, early bedtime.</div></div></div>
      <div class="list-row soft"><div style="flex:1;"><strong>Meaning</strong><div class="small">Keeps you from drifting. Gratitude, journaling, texting someone, planning something to look forward to, writing the life you want.</div></div></div>

    <div class="card">
      <h2>Daily Check</h2>
      <div class="small">That is enough: one thing for your body, one thing that cared for you, and one thing that gave the day meaning.</div>
      <label class="list-row soft" style="align-items:center;"><div style="flex:1;"><strong>Body</strong><div class="small">${escapeHtml(todayPlan.movement || "Do one body anchor")}</div></div><input type="checkbox" id="resetBody" ${entry.body?"checked":""} style="transform:scale(1.2);"></label>
      <label class="list-row soft" style="align-items:center;"><div style="flex:1;"><strong>Care</strong><div class="small">${escapeHtml(todayPlan.care || "Do one caring thing")}</div></div><input type="checkbox" id="resetCare" ${entry.care?"checked":""} style="transform:scale(1.2);"></label>
      <label class="list-row soft" style="align-items:center;"><div style="flex:1;"><strong>Meaning</strong><div class="small">${escapeHtml(todayPlan.meaning || "Do one meaningful thing")}</div></div><input type="checkbox" id="resetMeaning" ${entry.meaning?"checked":""} style="transform:scale(1.2);"></label>
      <label class="input-label" style="margin-top:10px;">Today's note</label>
      <textarea class="input" id="resetNote" placeholder="What helped today feel safer, steadier, or more hopeful?">${escapeHtml(entry.note || "")}</textarea>
      <div class="btn-row">
        <button class="btn" id="saveResetDayBtn">Save day</button>
      </div>
    </div>

    <div class="card">
      <h2>Weekly Template</h2>
      <div class="small">A Monday-start rhythm that feels more sustainable than trying to fix yourself overnight.</div>
      ${days.map(day=>`
        <div class="list-row soft">
          <div style="flex:1;">
            <div style="font-weight:600;">${day}</div>
            <div class="small">Move: ${escapeHtml(resetCompass.weekTemplate[day].movement)}</div>
            <div class="small">Care: ${escapeHtml(resetCompass.weekTemplate[day].care)}</div>
            <div class="small">Meaning: ${escapeHtml(resetCompass.weekTemplate[day].meaning)}</div>
          </div>
          <button class="btn" type="button" data-edit-reset-day="${day}">Edit</button>
        </div>
      `).join("")}
      <div id="resetEditor" class="hidden" style="margin-top:12px;">
        <div class="small" id="resetEditorTitle">Edit day</div>
        <label class="input-label">Movement</label>
        <input class="input" id="resetEditMovement">
        <label class="input-label">Care</label>
        <input class="input" id="resetEditCare">
        <label class="input-label">Meaning</label>
        <input class="input" id="resetEditMeaning">
        <div class="btn-row">
          <button class="btn primary" id="saveResetTemplateBtn">Save day</button>
          <button class="btn" id="cancelResetTemplateBtn">Cancel</button>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn danger" id="resetWeekTemplateBtn">Restore default week</button>
      </div>
    </div>
  `;

  const saveResetEntry = ()=>{
    resetCompass.days = resetCompass.days || {};
    resetCompass.days[today] = {
      body: !!wrap.querySelector("#resetBody").checked,
      care: !!wrap.querySelector("#resetCare").checked,
      meaning: !!wrap.querySelector("#resetMeaning").checked,
      note: (wrap.querySelector("#resetNote").value || "").trim()
    };
    persist();
  };

  wrap.querySelector("#saveResetDayBtn").onclick=()=>{
    saveResetEntry();
    showToast("Reset day saved");
    renderReset();
  };
  ["#resetBody","#resetCare","#resetMeaning"].forEach(sel=>{
    wrap.querySelector(sel).onchange=()=>{
      saveResetEntry();
      showToast("Reset updated");
      renderReset();
    };
  });
  let editingDay = "";
  const editor = wrap.querySelector("#resetEditor");
  const editorTitle = wrap.querySelector("#resetEditorTitle");
  const editMovement = wrap.querySelector("#resetEditMovement");
  const editCare = wrap.querySelector("#resetEditCare");
  const editMeaning = wrap.querySelector("#resetEditMeaning");
  wrap.querySelectorAll("[data-edit-reset-day]").forEach(btn=>{
    btn.onclick=()=>{
      editingDay = btn.getAttribute("data-edit-reset-day") || "Mon";
      const row = resetCompass.weekTemplate[editingDay] || {movement:"", care:"", meaning:""};
      editorTitle.textContent = `Edit ${editingDay}`;
      editMovement.value = row.movement || "";
      editCare.value = row.care || "";
      editMeaning.value = row.meaning || "";
      editor.classList.remove("hidden");
    };
  });
  wrap.querySelector("#saveResetTemplateBtn").onclick=()=>{
    if(!editingDay) return;
    resetCompass.weekTemplate[editingDay] = {
      movement:(editMovement.value || "").trim(),
      care:(editCare.value || "").trim(),
      meaning:(editMeaning.value || "").trim()
    };
    persist();
    showToast(`${editingDay} plan saved`);
    renderReset();
  };
  wrap.querySelector("#cancelResetTemplateBtn").onclick=()=>{
    editor.classList.add("hidden");
  };
  wrap.querySelector("#resetWeekTemplateBtn").onclick=()=>{
    resetCompass.weekTemplate = normalizeResetWeekTemplate(defaultResetWeekTemplate());
    persist();
    showToast("Default week restored");
    renderReset();
  };
}

function renderHistory(){
  const wrap=document.getElementById("screen-history");
  if(!wrap) return;

  const historyMode = window._historyMode || "all";
  const days = [];
  for(let i=0;i<28;i++){
    const day = addDaysISO(todayISO(), -i);
    const summary = activitySummaryFor(day);
    days.push({
      day,
      workoutCount: summary.workoutCount,
      challengeCount: summary.challengeCount,
      healthCount: summary.healthCount,
      totalPoints: summary.points,
      hasAny: summary.hasAny
    });
  }

  const filteredDays = days.filter(d=>{
    if(historyMode==="active") return d.hasAny;
    if(historyMode==="workouts") return d.workoutCount>0;
    return true;
  });
  let currentStreak = 0;
  for(const day of days){
    if(!day.hasAny) break;
    currentStreak += 1;
  }
  let longestStreak = 0;
  let running = 0;
  days.forEach(day=>{
    if(day.hasAny){
      running += 1;
      longestStreak = Math.max(longestStreak, running);
    } else {
      running = 0;
    }
  });
  const totalWorkoutPoints = days.reduce((s,d)=>s+d.totalPoints,0);
  const activeDays = days.filter(d=>d.hasAny).length;
  const recentBadges = achievements.filter(a=>a.type==="challenge_badge").slice(0,8);
  const recentWorkouts = entries.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,12);
  const records = computeRecords();

  wrap.innerHTML=`
    <div class="card hero-card">
      <div class="hero-head">
        <div>
          <div class="hero-kicker">📈 History & Trends</div>
          <h2 class="hero-title">Your streaks and records</h2>
          <div class="small hero-sub">See how the last month is stacking up and where your best efforts happened.</div>
        </div>
        <div class="score-pill">
          <div class="small">Active days</div>
          <div class="big-score" style="margin:2px 0 0 0;">${activeDays}</div>
        </div>
      </div>
      <div class="quick-grid" style="margin-top:14px;">
        <div class="stat-chip"><div class="row-between"><div>Longest streak</div><div class="badge-num">${longestStreak}</div></div><div class="small">Days with any activity</div></div>
        <div class="stat-chip"><div class="row-between"><div>Current streak</div><div class="badge-num">${currentStreak}</div></div><div class="small">Including today</div></div>
        <div class="stat-chip"><div class="row-between"><div>28-day points</div><div class="badge-num">${totalWorkoutPoints}</div></div><div class="small">Workout, challenge, health</div></div>
        <div class="stat-chip"><div class="row-between"><div>Best week</div><div class="badge-num">${records.bestWeek.value || 0}</div></div><div class="small">${records.bestWeek.label || "No record yet"}</div></div>
      </div>
    </div>

    <div class="card">
      <h2>🌟 Records</h2>
      <div class="record-grid">
        <div class="record-card">
          <div class="small">Longest workout</div>
          <div class="record-value">${records.longestWorkout.value || 0} min</div>
          <div class="small">${escapeHtml(records.longestWorkout.label || "No workout yet")} ${records.longestWorkout.date ? `- ${records.longestWorkout.date}` : ""}</div>
        </div>
        <div class="record-card">
          <div class="small">Most steps</div>
          <div class="record-value">${records.mostSteps.value || 0}</div>
          <div class="small">${records.mostSteps.date || "No step record yet"}</div>
        </div>
        <div class="record-card">
          <div class="small">Best week</div>
          <div class="record-value">${records.bestWeek.value || 0}</div>
          <div class="small">${records.bestWeek.label || "No weekly record yet"}</div>
        </div>
        <div class="record-card">
          <div class="small">Best month</div>
          <div class="record-value">${records.bestMonth.value || 0}</div>
          <div class="small">${records.bestMonth.label || "No monthly record yet"}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>🗂️ History</h2>
      <div class="small">Your last 28 days at a glance.</div>
      <div class="segmented" style="margin-top:12px;">
        <button class="btn ${historyMode==="all"?"soft":""}" data-history-mode="all">All days</button>
        <button class="btn ${historyMode==="active"?"soft":""}" data-history-mode="active">Active only</button>
        <button class="btn ${historyMode==="workouts"?"soft":""}" data-history-mode="workouts">Workouts</button>
      </div>
    </div>

    <div class="card">
      <h2>🧾 Daily Rollup</h2>
      ${filteredDays.slice(0,10).map(day=>`
        <div class="list-row soft">
          <div style="flex:1;">
            <div style="font-weight:600;">${day.day}</div>
            <div class="small">${day.workoutCount} workouts - ${day.challengeCount} challenge checks - ${day.healthCount} health logs</div>
          </div>
          <div class="badge-num">${day.totalPoints}</div>
        </div>
      `).join("") || '<div class="small">No days match this filter yet.</div>'}
    </div>

    <div class="card">
      <h2>💪 Recent Workouts</h2>
      ${recentWorkouts.length ? recentWorkouts.map(e=>`
        <div class="list-row soft">
          <div style="flex:1;">
            <div style="font-weight:600;">${escapeHtml((e.category||"Workout"))} - ${escapeHtml(e.date||"")}</div>
            <div class="small">${e.duration?`${escapeHtml(e.duration)} min - `:""}${e.km?`${escapeHtml(e.km)} km - `:""}${e.steps?`${escapeHtml(e.steps)} steps`:""}</div>
          </div>
          <div class="badge-num">${minutesToPoints(Number(e.duration)||0)}</div>
        </div>
      `).join("") : '<div class="small">No workouts logged yet.</div>'}
    </div>

    <div class="card">
      <h2>🏅 Challenge Badges</h2>
      ${recentBadges.length ? recentBadges.map(b=>`
        <div class="list-row soft">
          <div style="flex:1;">
            <div style="font-weight:600;">${escapeHtml(b.rewardName || "Badge")}</div>
            <div class="small">${escapeHtml(b.badgeTier || "Bronze")} tier - ${escapeHtml(b.name || "Challenge")} - ${escapeHtml((b.completedAt||"").slice(0,10))}</div>
          </div>
        </div>
      `).join("") : '<div class="small">Complete a custom challenge to earn a badge.</div>'}
    </div>
  `;

  wrap.querySelectorAll("[data-history-mode]").forEach(btn=>{
    btn.onclick=()=>{
      window._historyMode = btn.getAttribute("data-history-mode") || "all";
      renderHistory();
    };
  });
}

const screenRenderers = {
  overview: renderOverview,
  plan: renderPlan,
  health: renderHealth,
  lifestyle: renderLifestyle,
  workout: renderWorkout,
  "75hard": render75Hard,
  reset: renderReset,
  history: renderHistory
};

const renderedScreens = Object.create(null);
let activeScreen = "";

function renderScreen(name, force=false){
  const renderer = screenRenderers[name];
  if(!renderer) return;
  if(!force && renderedScreens[name]) return;
  try{
    renderer();
    renderedScreens[name] = true;
  }catch(err){
    const target = document.getElementById('screen-'+name);
    if(target){
      target.innerHTML = `<div class="card"><h2>Screen Error</h2><div class="small">${escapeHtml(String(err && err.message ? err.message : err))}</div></div>`;
    }
    showToast("Screen error");
    console.error(err);
  }
}

function showScreen(name){
  if(name===activeScreen) return;
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.remove('hidden');
  const navBtn = document.querySelector('.nav-btn[data-target="'+name+'"]');
  if(navBtn) navBtn.classList.add('active');
  activeScreen = name;
  if(name==="lifestyle"){
    window._lifeSelected = todayISO();
    renderScreen(name, true);
    return;
  }
  if(name==="history"){
    renderScreen(name, true);
    return;
  }
  renderScreen(name);
}
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    showScreen(btn.getAttribute('data-target'));
  });
});
try{
  showScreen("overview");
}catch(err){
  const target = document.getElementById('screen-overview');
  if(target){
    target.innerHTML = `<div class="card"><h2>Startup Error</h2><div class="small">${escapeHtml(String(err && err.message ? err.message : err))}</div></div>`;
  }
  console.error(err);
}

document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "hidden") flushPersist();
});
window.addEventListener("pagehide", flushPersist);
window.addEventListener("beforeunload", flushPersist);

if('serviceWorker' in navigator && /^https?:$/i.test(location.protocol)){
  navigator.serviceWorker.register('./service-worker.js').catch((err)=>console.error(err));
}
